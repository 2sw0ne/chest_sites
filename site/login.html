<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHEST — Connexion</title>
<!-- Fond sombre IMMÉDIAT (voir app.html pour l'explication complète) : évite le blanc par défaut du
     navigateur pendant que les polices/CSS externes chargent. -->
<style>html,body{background:#050505}</style>
<!-- Redirection immédiate vers app.html (branche experiment/merge-login-welcome, 2026-09-23, retour
     utilisateur : « le passage entre localhost:8934/login.html et app.html#/dashboard » — il arrivait
     encore sur CETTE page séparée, par habitude/favori, jamais sur le formulaire intégré à app.html qui
     remplace pourtant tout ce fichier pour l'usage normal). app.html affiche déjà lui-même l'écran de
     connexion (voir #authOverlay) quand personne n'est connecté — donc peu importe comment on arrive
     ici (favori, lien direct, ancien onglet), on doit toujours atterrir sur LUI, jamais sur cette page-ci.
     Placée tout en haut, avant tout le reste, pour ne jamais laisser transparaître cette ancienne page. -->
<script>try { window.location.replace('app.html' + location.search); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"></noscript>
<link rel="stylesheet" href="css/tokens.css?v=2">
<script src="js/theme.js"></script>
<!-- Préchargement d'app.html (retour utilisateur 2026-09-23 : « le fond s'arrête de bouger le temps du
     chargement, un petit freeze ») : une vraie continuité d'animation à travers une navigation entre deux
     documents est impossible (le contexte JS/WebGL de cette page s'arrête forcément quand elle se ferme),
     mais on peut réduire le trou au minimum en ayant déjà tout ce dont app.html a besoin en cache AVANT que
     la connexion réussisse — son premier rendu (et sa 1re image de shader) devient alors quasi instantané au
     lieu d'attendre le réseau. `rel="prefetch"` = priorité basse, ne retarde rien sur CETTE page. -->
<link rel="prefetch" href="app.html">
<link rel="prefetch" href="css/tokens.css?v=2">
<link rel="prefetch" href="css/layout.css?v=3">
<link rel="prefetch" href="css/chest-da.css?v=16">
<link rel="prefetch" href="css/patch-chest-da.css?v=16">
<link rel="prefetch" href="css/welcome.css?v=33">
<link rel="prefetch" href="js/config.js">
<link rel="prefetch" href="js/accounts-auth.js">
<link rel="prefetch" href="js/shell.js?v=3">
<link rel="prefetch" href="js/nav.js?v=5">
<link rel="prefetch" href="js/welcome.js?v=56">
<link rel="prefetch" href="assets/logo-chest-hero.webp">
<style>
  /* ============================================================
     Page de connexion — refonte 2026-09-23 (demande utilisateur : « je veux que ce soit le fond de la
     page welcome, avec au centre la fenêtre d'inscription et le logo. et une fois connecté ça s'enlève
     en fondu et laisse apparaître le welcome ») : même shader animé que le hero de Welcome (js/hero-bg.js,
     copie volontairement séparée — voir ce fichier), carte centrée par-dessus au lieu du photo+carte à
     droite d'avant. À la connexion réussie, la carte se fond (1,2 s) avant de rejoindre app.html, qui
     affiche alors Welcome sur EXACTEMENT le même fond : la transition reste visuellement continue.
     ============================================================ */
  *{ box-sizing:border-box; }
  html, body{ margin:0; min-height:100%; height:100%; overflow:hidden; }
  body{
    font-family:'Instrument Sans', system-ui, sans-serif; color:var(--ink); background:#050505;
    height:100vh;
  }

  .auth-hero{ position:fixed; inset:0; z-index:0; overflow:hidden; background:#050505; }
  .auth-hero canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #authStars{ z-index:1; }

  .auth-stage{
    position:relative; z-index:2; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:40px 20px; transition:opacity 1.2s cubic-bezier(.16,1,.3,1);
  }
  .auth-stage.is-leaving{ opacity:0; pointer-events:none; }

  .auth-card{
    width:100%; max-width:410px; position:relative;
    padding:40px 32px 32px;
    background:rgba(10,10,12,.66); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.1); border-radius:24px;
    box-shadow:0 30px 90px rgba(0,0,0,.6), inset 1.5px 1.5px 0 rgba(255,255,255,.06);
    text-align:center;
  }
  .auth-card__logo{
    width:88px; height:88px; object-fit:contain; display:block; margin:-78px auto 16px;
    filter:drop-shadow(0 14px 28px rgba(252,18,131,.4));
  }
  .auth-card h1{ font-size:20px; font-weight:700; letter-spacing:-.01em; margin:0 0 4px; }
  .auth-card__lead{ font-size:13.5px; color:var(--muted); margin:0 0 28px; }

  .auth-field{ position:relative; margin-bottom:12px; text-align:left; }
  .auth-field__icon{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    width:17px; height:17px; color:var(--faint); pointer-events:none;
  }
  .auth-field input{
    width:100%; padding:14px 16px 14px 44px; font:inherit; font-size:13.5px; color:var(--ink);
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:13px;
    transition:border-color .15s, background .15s;
  }
  .auth-field input::placeholder{ color:var(--faint); }
  .auth-field input:focus{ outline:none; border-color:var(--acc); background:rgba(255,255,255,.06); }
  .auth-field__toggle{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    border:none; background:none; color:var(--faint); cursor:pointer; padding:0;
  }
  .auth-field__toggle:hover{ color:var(--muted); }
  .auth-field__toggle svg{ width:17px; height:17px; }

  .auth-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 0 20px; font-size:12.5px; }
  .auth-remember{ display:flex; align-items:center; gap:8px; color:var(--muted); cursor:pointer; user-select:none; }
  .auth-remember input{ width:15px; height:15px; accent-color:var(--acc); cursor:pointer; }
  .auth-forgot{ color:var(--acc); text-decoration:none; background:none; border:none; font:inherit; font-size:12.5px; cursor:pointer; padding:0; }
  .auth-forgot:hover{ text-decoration:underline; }

  .auth-error{ font-size:12.5px; color:var(--red); min-height:0; margin:0 0 14px; text-align:left; }
  .auth-error:empty{ display:none; }
  .auth-note{ font-size:12px; color:var(--green); min-height:0; margin:0 0 14px; text-align:left; }
  .auth-note:empty{ display:none; }

  .auth-submit{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:14px; font:inherit; font-size:14.5px; font-weight:700; color:#fff; letter-spacing:-.005em;
    border:none; border-radius:13px; cursor:pointer;
    background:linear-gradient(90deg, var(--acc), var(--acc2));
    box-shadow:0 14px 32px rgba(252,18,131,.28);
    transition:transform .15s, box-shadow .15s;
  }
  .auth-submit:hover{ box-shadow:0 16px 38px rgba(252,18,131,.4); }
  .auth-submit:active{ transform:scale(.98); }
  .auth-submit:disabled{ opacity:.65; cursor:default; box-shadow:none; }

  .auth-footnote{ font-size:12.5px; color:var(--muted); margin:22px 0 0; }
  .auth-footnote a{ color:var(--acc); text-decoration:none; font-weight:600; }
  .auth-footnote a:hover{ text-decoration:underline; }

  @media (max-width:760px){ .auth-card{ max-width:380px; padding:36px 24px 28px; } }
</style>
</head>
<body>

<div class="auth-hero" aria-hidden="true">
  <canvas id="authLight"></canvas>
  <canvas id="authStars"></canvas>
</div>

<div class="auth-stage" id="authStage">
  <div class="auth-card">
    <img class="auth-card__logo" src="assets/logo-chest-hero.webp" alt="CHEST">
    <h1>Bienvenue sur CHEST</h1>
    <p class="auth-card__lead">Ton prochain niveau t'attend.</p>

    <form id="loginForm" autocomplete="off" novalidate>
      <div class="auth-field">
        <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3 6l9 7 9-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input id="email" type="email" placeholder="Adresse e-mail" required autocomplete="username">
      </div>
      <div class="auth-field">
        <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5" stroke-linecap="round"/></svg>
        <input id="password" type="password" placeholder="Mot de passe" required autocomplete="current-password" style="padding-right:44px">
        <button type="button" class="auth-field__toggle" id="pwToggle" aria-label="Afficher le mot de passe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="auth-row">
        <label class="auth-remember"><input type="checkbox" id="remember" checked> Se souvenir de moi</label>
        <button type="button" class="auth-forgot" id="forgotBtn">Mot de passe oublié ?</button>
      </div>

      <p class="auth-error" id="formError"></p>
      <p class="auth-note" id="formNote"></p>

      <button type="submit" class="auth-submit" id="submitBtn">
        <span id="submitLabel">Se connecter</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <p class="auth-footnote">Pas encore de compte ? <a href="signup.html">Créer un compte</a></p>
  </div>
</div>

<script src="js/config.js?v=3"></script>
<script src="js/config.local.js"></script>
<script src="js/accounts-auth.js"></script>
<script src="js/hero-bg.js"></script>
<script>
(() => {
  CHESTHeroBg.init(document.getElementById('authLight'), document.getElementById('authStars'), { mouseTarget: document.querySelector('.auth-hero') });

  const form = document.getElementById('loginForm');
  const errEl = document.getElementById('formError');
  const noteEl = document.getElementById('formNote');
  const submitBtn = document.getElementById('submitBtn');
  const submitLabel = document.getElementById('submitLabel');
  const stage = document.getElementById('authStage');

  if (CHESTAccounts.isLoggedIn()) {
    window.location.replace('app.html');
  }

  document.getElementById('pwToggle').addEventListener('click', () => {
    const input = document.getElementById('password');
    const btn = document.getElementById('pwToggle');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.setAttribute('aria-label', showing ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
  });

  // Retour arrière du navigateur juste après une connexion : la page peut être restaurée depuis le
  // cache (bfcache) telle qu'on l'a quittée, carte encore invisible (is-leaving) — sans ça elle
  // resterait figée en fondu, ce qui ressemblerait justement à un chargement cassé.
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) { stage.classList.remove('is-leaving'); submitBtn.disabled = false; submitLabel.textContent = 'Se connecter'; }
  });

  document.getElementById('forgotBtn').addEventListener('click', () => {
    errEl.textContent = '';
    noteEl.textContent = "La réinitialisation par e-mail n'est pas encore branchée — contacte l'administrateur pour remettre ton mot de passe à zéro.";
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.textContent = '';
    noteEl.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    submitBtn.disabled = true;
    submitLabel.textContent = 'Connexion…';
    try {
      await CHESTAccounts.login({ email, password, remember });
      try { sessionStorage.setItem('chest_welcome', '1'); } catch (e) { /* tant pis */ }
      // Fondu de la carte (1,2 s) avant de rejoindre app.html, qui affiche Welcome sur le même fond animé —
      // décision utilisateur : « ça s'enlève de manière fluide... et laisse apparaître le welcome ».
      stage.classList.add('is-leaving');
      setTimeout(() => { window.location.href = 'app.html'; }, 1250);
    } catch (err) {
      errEl.textContent = err.message;
      submitBtn.disabled = false;
      submitLabel.textContent = 'Se connecter';
    }
  });
})();
</script>
</body>
</html>
