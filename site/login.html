<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHEST — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=2">
<script src="js/theme.js"></script>
<style>
  /* ============================================================
     Page de connexion — refonte complete (retour direct utilisateur
     du 2026-09-17, inspiration fournie : photo pleine page + logo
     lumineux flottant au-dessus de la carte "Bienvenue sur CHEST").
     Immersive, sans le chrome habituel du site (sidebar/topbar) - la
     photo et la carte sont les deux seuls elements a l'ecran.
     ============================================================ */
  *{ box-sizing:border-box; }
  html, body{ margin:0; min-height:100%; }
  body{
    font-family:'Instrument Sans', system-ui, sans-serif; color:var(--ink); background:#050505;
    min-height:100vh; overflow-x:hidden;
  }

  .auth-bg{
    position:fixed; inset:0; z-index:0;
    background:url("assets/login-bg.jpg") center 38%/cover no-repeat;
  }
  /* Fondu plus sombre du cote de la carte (droite en desktop, bas en
     mobile) pour garder le formulaire lisible sans cacher la photo. */
  .auth-scrim{
    position:fixed; inset:0; z-index:1;
    background:
      linear-gradient(90deg, rgba(4,4,5,.15) 0%, rgba(4,4,5,.55) 55%, rgba(4,4,5,.88) 100%),
      linear-gradient(0deg, rgba(4,4,5,.5), transparent 40%);
  }

  .auth-page{
    position:relative; z-index:2; min-height:100vh;
    display:flex; align-items:center; justify-content:flex-end;
    padding:40px clamp(24px,6vw,96px);
  }

  .auth-card{
    width:100%; max-width:430px; position:relative;
    padding:40px 32px 32px;
    background:rgba(10,10,12,.72); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.09); border-radius:24px;
    box-shadow:0 30px 80px rgba(0,0,0,.55);
    text-align:center;
  }
  .auth-card__logo{
    width:104px; height:104px; object-fit:contain; display:block; margin:-92px auto 18px;
    filter:drop-shadow(0 14px 28px rgba(252,18,131,.35));
  }
  .auth-card h1{ font-size:20px; font-weight:700; letter-spacing:-.01em; margin:0 0 4px; }
  .auth-card__lead{ font-size:13.5px; color:var(--muted); margin:0 0 28px; }

  .auth-field{ position:relative; margin-bottom:12px; text-align:left; }
  .auth-field__icon{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    width:17px; height:17px; color:var(--faint); pointer-events:none;
  }
  .auth-field input{
    width:100%; padding:14px 16px 14px 44px; font:inherit; font-size:13.5px; color:var(--ink);
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:13px;
    transition:border-color .15s, background .15s;
  }
  .auth-field input::placeholder{ color:var(--faint); }
  .auth-field input:focus{ outline:none; border-color:var(--acc); background:rgba(255,255,255,.06); }
  .auth-field__toggle{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    border:none; background:none; color:var(--faint); cursor:pointer; padding:0;
  }
  .auth-field__toggle:hover{ color:var(--muted); }
  .auth-field__toggle svg{ width:17px; height:17px; }

  .auth-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 0 20px; font-size:12.5px; }
  .auth-remember{ display:flex; align-items:center; gap:8px; color:var(--muted); cursor:pointer; user-select:none; }
  .auth-remember input{ width:15px; height:15px; accent-color:var(--acc); cursor:pointer; }
  .auth-forgot{ color:var(--acc); text-decoration:none; background:none; border:none; font:inherit; font-size:12.5px; cursor:pointer; padding:0; }
  .auth-forgot:hover{ text-decoration:underline; }

  .auth-error{ font-size:12.5px; color:var(--red); min-height:0; margin:0 0 14px; text-align:left; }
  .auth-error:empty{ display:none; }
  .auth-note{ font-size:12px; color:var(--green); min-height:0; margin:0 0 14px; text-align:left; }
  .auth-note:empty{ display:none; }

  .auth-submit{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:14px; font:inherit; font-size:14.5px; font-weight:700; color:#fff; letter-spacing:-.005em;
    border:none; border-radius:13px; cursor:pointer;
    background:linear-gradient(90deg, var(--acc), var(--acc2));
    box-shadow:0 14px 32px rgba(252,18,131,.28);
    transition:transform .15s, box-shadow .15s;
  }
  .auth-submit:hover{ box-shadow:0 16px 38px rgba(252,18,131,.4); }
  .auth-submit:active{ transform:scale(.98); }
  .auth-submit:disabled{ opacity:.65; cursor:default; box-shadow:none; }

  .auth-divider{ display:flex; align-items:center; gap:14px; margin:22px 0; font-size:11px; letter-spacing:.08em; color:var(--faint); }
  .auth-divider::before, .auth-divider::after{ content:''; flex:1; height:1px; background:rgba(255,255,255,.1); }

  .auth-social{ display:flex; justify-content:center; gap:14px; margin-bottom:24px; }
  .auth-social button{
    width:52px; height:52px; border-radius:50%; border:1px solid rgba(255,255,255,.12);
    background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:transform .15s, box-shadow .15s;
  }
  .auth-social button:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 10px 22px rgba(0,0,0,.35); }
  .auth-social button:disabled{ cursor:not-allowed; opacity:.55; }
  .auth-social button svg{ width:22px; height:22px; }
  .auth-social button.is-discord{ background:#1a1a1e; border-color:rgba(255,255,255,.14); }

  .auth-footnote{ font-size:12.5px; color:var(--muted); margin:0; }
  .auth-footnote a{ color:var(--acc); text-decoration:none; font-weight:600; }
  .auth-footnote a:hover{ text-decoration:underline; }

  @media (max-width:760px){
    .auth-page{ justify-content:center; align-items:flex-end; padding:24px 16px 40px; }
    .auth-scrim{
      background:
        linear-gradient(0deg, rgba(4,4,5,.2) 0%, rgba(4,4,5,.75) 45%, rgba(4,4,5,.95) 100%);
    }
    .auth-card{ max-width:420px; }
  }
</style>
</head>
<body>

<div class="auth-bg" aria-hidden="true"></div>
<div class="auth-scrim" aria-hidden="true"></div>

<div class="auth-page">
  <div class="auth-card">
    <img class="auth-card__logo" src="assets/logo-chest-glow.png" alt="CHEST">
    <h1>Bienvenue sur CHEST</h1>
    <p class="auth-card__lead">Ton prochain niveau t'attend.</p>

    <form id="loginForm" autocomplete="off" novalidate>
      <div class="auth-field">
        <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3 6l9 7 9-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input id="email" type="email" placeholder="Adresse e-mail" required autocomplete="username">
      </div>
      <div class="auth-field">
        <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5" stroke-linecap="round"/></svg>
        <input id="password" type="password" placeholder="Mot de passe" required autocomplete="current-password" style="padding-right:44px">
        <button type="button" class="auth-field__toggle" id="pwToggle" aria-label="Afficher le mot de passe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="auth-row">
        <label class="auth-remember"><input type="checkbox" id="remember" checked> Se souvenir de moi</label>
        <button type="button" class="auth-forgot" id="forgotBtn">Mot de passe oublié ?</button>
      </div>

      <p class="auth-error" id="formError"></p>
      <p class="auth-note" id="formNote"></p>

      <button type="submit" class="auth-submit" id="submitBtn">
        <span id="submitLabel">Se connecter</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <div class="auth-divider">OU</div>

    <div class="auth-social">
      <button type="button" disabled title="Bientôt disponible" aria-label="Continuer avec Apple">
        <svg viewBox="0 0 24 24"><path fill="#000" d="M16.365 1.43c0 1.14-.428 2.106-1.283 2.898-.855.792-1.86 1.24-3.017 1.14-.14-1.117.333-2.09 1.19-2.9.856-.81 1.905-1.25 3.11-1.138zM20.5 17.35c-.5 1.15-1.1 2.24-1.8 3.27-.95 1.38-1.72 2.34-2.32 2.88-.92.83-1.9 1.26-2.95 1.28-.75.02-1.66-.21-2.72-.7-1.07-.49-2.05-.71-2.95-.71-.94 0-1.94.22-3.02.71-1.08.5-1.95.74-2.62.72-1-.04-1.98-.48-2.94-1.34-.64-.58-1.44-1.58-2.4-3.03-1.03-1.55-1.87-3.34-2.53-5.4-.7-2.22-1.05-4.37-1.05-6.45 0-2.4.5-4.44 1.5-6.08.79-1.32 1.83-2.36 3.15-3.13 1.32-.77 2.75-1.16 4.28-1.19.79 0 1.83.24 3.14.72 1.3.48 2.14.72 2.5.72.27 0 1.19-.28 2.76-.85 1.48-.53 2.74-.75 3.76-.67 2.78.22 4.87 1.32 6.25 3.3-2.49 1.5-3.72 3.6-3.7 6.31.02 2.11.77 3.86 2.25 5.25.67.64 1.42 1.13 2.24 1.48z"/></svg>
      </button>
      <button type="button" disabled title="Bientôt disponible" aria-label="Continuer avec Google">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.04 12.27c0-.82-.07-1.42-.22-2.04H12.24v3.7h6.19c-.12 1.02-.8 2.57-2.31 3.6l-.02.14 3.35 2.6.23.02c2.13-1.97 3.36-4.86 3.36-8.02z"/><path fill="#34A853" d="M12.24 23.03c3.04 0 5.6-1 7.46-2.72l-3.56-2.76c-.95.66-2.23 1.13-3.9 1.13-2.98 0-5.5-1.97-6.4-4.69l-.13.01-3.48 2.7-.05.12c1.85 3.68 5.65 6.21 10.06 6.21z"/><path fill="#FBBC05" d="M5.84 14c-.24-.7-.37-1.44-.37-2.2 0-.77.13-1.5.36-2.2l-.01-.15-3.52-2.74-.12.06A10.98 10.98 0 0 0 1 11.8c0 1.78.43 3.46 1.18 4.95l3.66-2.75z"/><path fill="#EA4335" d="M12.24 5.1c2.12 0 3.55.91 4.37 1.67l3.19-3.11C17.82 1.9 15.28.8 12.24.8 7.83.8 4.03 3.33 2.18 7.02l3.65 2.83c.91-2.72 3.43-4.75 6.41-4.75z"/></svg>
      </button>
      <button type="button" class="is-discord" disabled title="Bientôt disponible" aria-label="Continuer avec Discord">
        <svg viewBox="0 0 24 24"><path fill="#fff" d="M20.32 5.36A17.5 17.5 0 0 0 15.9 4c-.2.36-.42.85-.58 1.23a16.2 16.2 0 0 0-4.66 0A9.6 9.6 0 0 0 10.08 4a17.4 17.4 0 0 0-4.42 1.37C2.98 9.24 2.27 13 2.61 16.72a17.6 17.6 0 0 0 5.36 2.72c.43-.59.82-1.22 1.15-1.88a11.3 11.3 0 0 1-1.8-.87c.15-.11.3-.23.44-.35 3.47 1.6 7.23 1.6 10.66 0 .15.12.29.24.44.35-.57.34-1.18.63-1.81.87.34.66.72 1.29 1.15 1.88a17.5 17.5 0 0 0 5.36-2.72c.4-4.32-.68-8.05-2.84-11.36zM9.68 14.4c-1.04 0-1.89-.97-1.89-2.16 0-1.19.83-2.16 1.89-2.16 1.07 0 1.92.98 1.9 2.16 0 1.19-.83 2.16-1.9 2.16zm6.27 0c-1.04 0-1.89-.97-1.89-2.16 0-1.19.83-2.16 1.89-2.16 1.07 0 1.92.98 1.9 2.16 0 1.19-.82 2.16-1.9 2.16z"/></svg>
      </button>
    </div>

    <p class="auth-footnote">Pas encore de compte ? <a href="signup.html">Créer un compte</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/config.local.js"></script>
<script src="js/accounts-auth.js"></script>
<script>
(() => {
  const form = document.getElementById('loginForm');
  const errEl = document.getElementById('formError');
  const noteEl = document.getElementById('formNote');
  const submitBtn = document.getElementById('submitBtn');
  const submitLabel = document.getElementById('submitLabel');

  if (CHESTAccounts.isLoggedIn()) {
    window.location.replace('dashboard.html');
  }

  document.getElementById('pwToggle').addEventListener('click', () => {
    const input = document.getElementById('password');
    const btn = document.getElementById('pwToggle');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.setAttribute('aria-label', showing ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
  });

  // Pas de vrai flux de reinitialisation cote serveur pour l'instant -
  // message honnete plutot qu'un lien mort ou une fausse promesse d'email
  // (meme principe de transparence que le reste de CHEST).
  document.getElementById('forgotBtn').addEventListener('click', () => {
    errEl.textContent = '';
    noteEl.textContent = "La réinitialisation par e-mail n'est pas encore branchée — contacte l'administrateur pour remettre ton mot de passe à zéro.";
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.textContent = '';
    noteEl.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    submitBtn.disabled = true;
    submitLabel.textContent = 'Connexion…';
    try {
      await CHESTAccounts.login({ email, password, remember });
      window.location.href = 'dashboard.html';
    } catch (err) {
      errEl.textContent = err.message;
      submitBtn.disabled = false;
      submitLabel.textContent = 'Se connecter';
    }
  });
})();
</script>
</body>
</html>
