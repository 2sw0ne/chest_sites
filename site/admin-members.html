<style>
  .member-row{
    display:grid; grid-template-columns:42px minmax(0,1fr) auto auto; align-items:center; gap:16px;
    padding:16px 0; border-bottom:1px solid var(--chest-rule);
  }
  .member-row:last-child{ border-bottom:none; }
  .member-row__avatar{
    width:42px; height:42px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--chest-acc),var(--chest-acc-2)); color:#fff;
    font-weight:700; font-size:15px;
  }
  .member-row__info{ min-width:0; }
  .member-row__name{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; color:var(--chest-ink); }
  .member-row__name .badge-admin{
    font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    color:var(--chest-acc); border:1px solid rgba(252,18,131,.45); background:rgba(252,18,131,.1);
    padding:3px 8px; border-radius:999px;
  }
  .member-row__email{ font-size:12px; color:var(--chest-ink-2); margin-top:2px; }
  .member-row__status{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    padding:4px 10px; border-radius:99px; flex-shrink:0; justify-self:end;
  }
  .member-row__status.pending{ background:rgba(232,179,57,.14); color:var(--chest-amber); }
  .member-row__status.approved{ background:rgba(51,230,166,.14); color:var(--chest-green); }
  .member-row__status.rejected{ background:rgba(255,77,94,.14); color:var(--chest-red); }
  .member-row__status.blocked{ background:rgba(255,77,94,.14); color:var(--chest-red); }
  .member-row__actions{ display:flex; gap:8px; flex-shrink:0; justify-self:end; }
  .member-row__actions .btn{ padding:7px 14px; font-size:12.5px; }
  .member-empty{ padding:40px 20px; text-align:center; color:var(--chest-ink-2); font-size:14px; }
  .member-error{ padding:16px 0; color:var(--chest-red); font-size:13.5px; }
  @media (max-width:700px){ .member-row{ grid-template-columns:42px minmax(0,1fr); row-gap:10px; } .member-row__status{ grid-column:2; justify-self:start; } .member-row__actions{ grid-column:1/-1; justify-self:start; } }
</style>

<script>
CHESTTour.init([
  { selector: '#membersCard', title: 'Gestion des membres', text: 'Accepte, refuse ou bloque les inscriptions. Tu reçois un email à chaque nouvelle demande si les notifications sont configurées.' },
]);

<script>
(() => {
  const card = document.getElementById('membersCard');

  function initials(m) {
    return `${(m.firstName || '?')[0]}${(m.lastName || '?')[0]}`.toUpperCase();
  }

  function statusLabel(status) {
    return { pending: 'En attente', approved: 'Approuvé', rejected: 'Refusé', blocked: 'Bloqué' }[status] || status;
  }

  function rowHtml(m) {
    const actions = m.status === 'pending'
      ? `<button class="btn btn-primary" data-approve="${m.id}">Accepter</button>
         <button class="btn btn-ghost" data-reject="${m.id}">Refuser</button>`
      : m.status === 'rejected' || m.status === 'blocked'
        ? `<button class="btn btn-primary" data-approve="${m.id}">${m.status === 'blocked' ? 'Débloquer' : 'Accepter quand même'}</button>`
        : `<button class="btn btn-ghost" data-block="${m.id}">Bloquer le compte</button>`;
    return `
      <div class="member-row" data-member-row="${m.id}">
        <div class="member-row__avatar">${initials(m)}</div>
        <div class="member-row__info">
          <div class="member-row__name">${m.firstName} ${m.lastName}${m.isAdmin ? '<span class="badge-admin">Admin</span>' : ''}</div>
          <div class="member-row__email">${m.email}</div>
        </div>
        <span class="member-row__status ${m.status}">${statusLabel(m.status)}</span>
        <div class="member-row__actions">${actions}</div>
      </div>`;
  }

  function renderCounts(members) {
    const zone = document.getElementById('memberCounts');
    const count = (st) => members.filter((m) => m.status === st).length;
    zone.innerHTML = `
      <div style="text-align:right"><div class="chest-label" style="margin-bottom:8px">En attente</div><div class="chest-kpi__val" style="color:var(--chest-amber);text-shadow:0 0 18px rgba(232,179,57,.3)">${count('pending')}</div></div>
      <div style="text-align:right"><div class="chest-label" style="margin-bottom:8px">Actifs</div><div class="chest-kpi__val is-pos">${count('approved')}</div></div>
      <div style="text-align:right"><div class="chest-label" style="margin-bottom:8px">Bloqués</div><div class="chest-kpi__val is-neg">${count('blocked')}</div></div>`;
  }

  async function render() {
    if (!CHESTAccounts.isAdmin()) {
      card.innerHTML = '<div class="member-error">Cette page est réservée aux administrateurs.</div>';
      return;
    }
    try {
      const members = await CHESTAccounts.fetchMembers();
      renderCounts(members);
      card.innerHTML = members.length
        ? members.map(rowHtml).join('')
        : '<div class="member-empty">Aucun membre pour l\'instant.</div>';
    } catch (err) {
      card.innerHTML = `<div class="member-error">Impossible de charger les membres : ${err.message}</div>`;
    }
  }

  card.addEventListener('click', async (e) => {
    const approveId = e.target.dataset.approve;
    const rejectId = e.target.dataset.reject;
    const blockId = e.target.dataset.block;
    if (!approveId && !rejectId && !blockId) return;
    if (blockId && !(await CHESTConfirm('Bloquer ce compte ? Son accès sera coupé immédiatement (déconnexion forcée) — tu pourras le réapprouver plus tard.'))) return;
    e.target.disabled = true;
    try {
      if (approveId) await CHESTAccounts.approveMember(approveId);
      if (rejectId) await CHESTAccounts.rejectMember(rejectId);
      if (blockId) await CHESTAccounts.blockMember(blockId);
      await render();
    } catch (err) {
      await CHESTAlert(err.message);
      e.target.disabled = false;
    }
  });

  render();
})();
</script>
