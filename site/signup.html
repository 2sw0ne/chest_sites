<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHEST — Créer un compte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=2">
<link rel="stylesheet" href="css/layout.css?v=4">
<script src="js/theme.js"></script>
<style>
  .gate__card{ max-width:420px; text-align:left; }
  .gate__card h1, .gate__card > p{ text-align:center; }
  .signup-field{ margin-bottom:14px; }
  .signup-field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .signup-field input{ width:100%; }
  .signup-row{ display:flex; gap:10px; }
  .signup-row .signup-field{ flex:1; }
  .signup-status{ font-size:13px; line-height:1.5; padding:12px 14px; border-radius:12px; margin-bottom:16px; display:none; }
  .signup-status.is-visible{ display:block; }
  .signup-status.is-pending{ background:rgba(249,164,94,.12); color:var(--acc2); }
  .signup-status.is-approved{ background:rgba(48,196,132,.12); color:var(--green); }
  .signup-status.is-error{ background:rgba(240,90,90,.12); color:var(--red); }
  .gate__footnote a{ color:var(--acc); text-decoration:none; }
  .gate__footnote a:hover{ text-decoration:underline; }
</style>
</head>
<body>

<div class="gate">
  <div class="gate__glow" aria-hidden="true"></div>
  <div class="gate__card">
    <div class="gate__mark" aria-hidden="true"></div>
    <h1>Créer un compte</h1>
    <p>Réservé aux personnes invitées par l'administrateur.</p>

    <p class="signup-status" id="statusMsg"></p>

    <form id="signupForm" autocomplete="off">
      <div class="signup-row">
        <div class="signup-field">
          <label for="firstName">Prénom</label>
          <input id="firstName" class="field" type="text" required>
        </div>
        <div class="signup-field">
          <label for="lastName">Nom</label>
          <input id="lastName" class="field" type="text" required>
        </div>
      </div>
      <div class="signup-field">
        <label for="email">Email</label>
        <input id="email" class="field" type="email" required autocomplete="off">
      </div>
      <div class="signup-field">
        <label for="password">Mot de passe (8 caractères minimum)</label>
        <input id="password" class="field" type="password" minlength="8" required autocomplete="new-password">
      </div>
      <p class="gate__error" id="formError"></p>
      <button type="submit" class="btn btn-primary gate__submit" id="submitBtn">Créer mon compte</button>
    </form>

    <p class="gate__footnote">Déjà un compte ? <a href="login.html">Se connecter</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/config.local.js"></script>
<script src="js/accounts-auth.js"></script>
<script>
(() => {
  const form = document.getElementById('signupForm');
  const errEl = document.getElementById('formError');
  const statusEl = document.getElementById('statusMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.textContent = '';
    statusEl.className = 'signup-status';

    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Envoi…';
    try {
      const result = await CHESTAccounts.signup({ firstName, lastName, email, password });
      form.hidden = true;
      statusEl.textContent = result.message;
      statusEl.classList.add('is-visible', result.status === 'approved' ? 'is-approved' : 'is-pending');
      if (result.status === 'approved') {
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      }
    } catch (err) {
      errEl.textContent = err.message;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Créer mon compte';
    }
  });
})();
</script>
</body>
</html>
