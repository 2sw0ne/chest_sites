<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHEST — Créer un compte</title>
<!-- Fond sombre IMMÉDIAT (voir app.html pour l'explication complète) : évite le blanc par défaut du
     navigateur pendant que les polices/CSS externes chargent. -->
<style>html,body{background:#050505}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"></noscript>
<link rel="stylesheet" href="css/tokens.css?v=2">
<script src="js/theme.js"></script>
<style>
  /* ============================================================
     Création de compte — même traitement que login.html (2026-09-23) : fond = shader animé du hero
     Welcome (js/hero-bg.js), carte centrée. Pas de fondu-vers-Welcome ici : signup() ne renvoie pas de
     session (approuvé automatiquement mais il faut quand même se connecter, voir accounts-bridge et
     CLAUDE.md « inscription ouverte à tous ») — seule la connexion ouvre vraiment Welcome.
     ============================================================ */
  *{ box-sizing:border-box; }
  html, body{ margin:0; min-height:100%; height:100%; overflow:hidden; }
  body{
    font-family:'Instrument Sans', system-ui, sans-serif; color:var(--ink); background:#050505;
    height:100vh;
  }

  .auth-hero{ position:fixed; inset:0; z-index:0; overflow:hidden; background:#050505; }
  .auth-hero canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #authStars{ z-index:1; }

  .auth-stage{
    position:relative; z-index:2; min-height:100vh; overflow-y:auto;
    display:flex; align-items:center; justify-content:center;
    padding:40px 20px; transition:opacity 1.2s cubic-bezier(.16,1,.3,1);
  }
  .auth-stage.is-leaving{ opacity:0; pointer-events:none; }

  .auth-card{
    width:100%; max-width:410px; position:relative;
    padding:40px 32px 32px;
    background:rgba(10,10,12,.66); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.1); border-radius:24px;
    box-shadow:0 30px 90px rgba(0,0,0,.6), inset 1.5px 1.5px 0 rgba(255,255,255,.06);
    text-align:center;
  }
  .auth-card__logo{
    width:88px; height:88px; object-fit:contain; display:block; margin:-78px auto 16px;
    filter:drop-shadow(0 14px 28px rgba(252,18,131,.4));
  }
  .auth-card h1{ font-size:20px; font-weight:700; letter-spacing:-.01em; margin:0 0 4px; }
  .auth-card__lead{ font-size:13.5px; color:var(--muted); margin:0 0 28px; }

  .auth-field{ position:relative; margin-bottom:12px; text-align:left; }
  .auth-field__icon{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    width:17px; height:17px; color:var(--faint); pointer-events:none;
  }
  .auth-field input{
    width:100%; padding:14px 16px 14px 44px; font:inherit; font-size:13.5px; color:var(--ink);
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:13px;
    transition:border-color .15s, background .15s;
  }
  .auth-field input::placeholder{ color:var(--faint); }
  .auth-field input:focus{ outline:none; border-color:var(--acc); background:rgba(255,255,255,.06); }
  .auth-field__toggle{
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    border:none; background:none; color:var(--faint); cursor:pointer; padding:0;
  }
  .auth-field__toggle:hover{ color:var(--muted); }
  .auth-field__toggle svg{ width:17px; height:17px; }

  .auth-row2{ display:flex; gap:10px; }
  .auth-row2 .auth-field{ flex:1; min-width:0; }
  @media (max-width:420px){ .auth-row2{ flex-direction:column; gap:0; } }

  .auth-hint{ font-size:11.5px; color:var(--faint); margin:-6px 0 14px; text-align:left; }

  .auth-error{ font-size:12.5px; color:var(--red); margin:0 0 14px; text-align:left; }
  .auth-error:empty{ display:none; }

  .signup-status{
    font-size:13px; line-height:1.55; padding:14px 16px; border-radius:13px;
    margin:0 0 16px; display:none; text-align:left; border:1px solid transparent;
  }
  .signup-status.is-visible{ display:block; }
  .signup-status.is-pending{ background:rgba(232,179,57,.12); border-color:rgba(232,179,57,.35); color:#f4d07a; }
  .signup-status.is-approved{ background:rgba(51,230,166,.12); border-color:rgba(51,230,166,.35); color:#7ff3ca; }
  .signup-status.is-error{ background:rgba(255,77,94,.12); border-color:rgba(255,77,94,.35); color:#ff94a0; }

  .auth-submit{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:14px; font:inherit; font-size:14.5px; font-weight:700; color:#fff; letter-spacing:-.005em;
    border:none; border-radius:13px; cursor:pointer;
    background:linear-gradient(90deg, var(--acc), var(--acc2));
    box-shadow:0 14px 32px rgba(252,18,131,.28);
    transition:transform .15s, box-shadow .15s;
  }
  .auth-submit:hover{ box-shadow:0 16px 38px rgba(252,18,131,.4); }
  .auth-submit:active{ transform:scale(.98); }
  .auth-submit:disabled{ opacity:.65; cursor:default; box-shadow:none; }

  .auth-footnote{ font-size:12.5px; color:var(--muted); margin:22px 0 0; }
  .auth-footnote a{ color:var(--acc); text-decoration:none; font-weight:600; }
  .auth-footnote a:hover{ text-decoration:underline; }

  @media (max-width:760px){ .auth-card{ max-width:380px; padding:36px 24px 28px; } }
</style>
</head>
<body>

<div class="auth-hero" aria-hidden="true">
  <canvas id="authLight"></canvas>
  <canvas id="authStars"></canvas>
</div>

<div class="auth-stage" id="authStage">
  <div class="auth-card">
    <img class="auth-card__logo" src="assets/logo-chest-hero.webp" alt="CHEST">
    <h1>Créer un compte</h1>
    <p class="auth-card__lead">Ton compte est créé et actif immédiatement.</p>

    <p class="signup-status" id="statusMsg"></p>

    <form id="signupForm" autocomplete="off">
      <div class="auth-row2">
        <div class="auth-field">
          <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.9-3.4 3.8-5.4 7.2-5.4s6.3 2 7.2 5.4" stroke-linecap="round"/></svg>
          <input id="firstName" type="text" placeholder="Prénom" autocomplete="given-name" aria-describedby="firstNameHint" required>
        </div>
        <div class="auth-field">
          <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.9-3.4 3.8-5.4 7.2-5.4s6.3 2 7.2 5.4" stroke-linecap="round"/></svg>
          <input id="lastName" type="text" placeholder="Nom" autocomplete="family-name" required>
        </div>
      </div>
      <p class="auth-hint" id="firstNameHint">Ton prénom s'affichera sur ta page d'accueil, sous « Welcome ».</p>

      <div class="auth-field">
        <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3 6l9 7 9-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input id="email" type="email" placeholder="Adresse e-mail" required autocomplete="off">
      </div>

      <div class="auth-field">
        <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5" stroke-linecap="round"/></svg>
        <input id="password" type="password" placeholder="Mot de passe" minlength="8" required autocomplete="new-password" style="padding-right:44px">
        <button type="button" class="auth-field__toggle" id="pwToggle" aria-label="Afficher le mot de passe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <p class="auth-hint">8 caractères minimum.</p>

      <p class="auth-error" id="formError"></p>

      <button type="submit" class="auth-submit" id="submitBtn">
        <span id="submitLabel">Créer mon compte</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <p class="auth-footnote">Déjà un compte ? <a href="login.html">Se connecter</a></p>
  </div>
</div>

<script src="js/config.js?v=2"></script>
<script src="js/config.local.js"></script>
<script src="js/accounts-auth.js"></script>
<script src="js/hero-bg.js"></script>
<script>
(() => {
  CHESTHeroBg.init(document.getElementById('authLight'), document.getElementById('authStars'), { mouseTarget: document.querySelector('.auth-hero') });

  const form = document.getElementById('signupForm');
  const errEl = document.getElementById('formError');
  const statusEl = document.getElementById('statusMsg');
  const submitBtn = document.getElementById('submitBtn');
  const submitLabel = document.getElementById('submitLabel');
  const stage = document.getElementById('authStage');

  document.getElementById('pwToggle').addEventListener('click', () => {
    const input = document.getElementById('password');
    const btn = document.getElementById('pwToggle');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.setAttribute('aria-label', showing ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
  });

  // Retour arrière du navigateur juste après un envoi : la page peut être restaurée depuis le cache
  // (bfcache) telle qu'on l'a quittée, carte encore invisible (is-leaving) — sans ça elle resterait
  // figée en fondu, ce qui ressemblerait justement à un chargement cassé.
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) { stage.classList.remove('is-leaving'); submitBtn.disabled = false; submitLabel.textContent = 'Créer mon compte'; }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.textContent = '';
    statusEl.className = 'signup-status';

    const cap = (v) => v.trim().replace(/(^|[\s'-])(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase('fr-FR'));
    const firstName = cap(document.getElementById('firstName').value);
    const lastName = cap(document.getElementById('lastName').value);
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitLabel.textContent = 'Envoi…';
    try {
      const result = await CHESTAccounts.signup({ firstName, lastName, email, password });
      form.hidden = true;
      statusEl.textContent = result.message;
      statusEl.classList.add('is-visible', result.status === 'approved' ? 'is-approved' : 'is-pending');
      if (result.status === 'approved') {
        setTimeout(() => {
          stage.classList.add('is-leaving');
          setTimeout(() => { window.location.href = 'login.html'; }, 1250);
        }, 1400);
      }
    } catch (err) {
      errEl.textContent = err.message;
      submitBtn.disabled = false;
      submitLabel.textContent = 'Créer mon compte';
    }
  });
})();
</script>
</body>
</html>
