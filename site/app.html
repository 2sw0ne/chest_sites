<!DOCTYPE html>
<html lang="fr" class="is-shell">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=2">
<link rel="stylesheet" href="css/layout.css?v=3">
<link rel="stylesheet" href="css/chest-da.css?v=13">
<link rel="stylesheet" href="css/patch-chest-da.css?v=13">
<link rel="stylesheet" href="css/welcome.css?v=3">
<script src="js/theme.js"></script>
<script src="js/config.js"></script>
<script src="js/config.local.js"></script>
<script src="js/accounts-auth.js"></script>
<script>CHESTAccounts.guard();</script>
</head>
<body class="chest-root">

<!-- Shell unique du site : la sidebar et la barre du haut vivent ICI, une
     seule fois. Chaque page (dashboard.html, calendar.html...) est chargée
     dans #chestView — elle ne recharge donc jamais le menu, seulement son
     propre contenu. Voir js/shell.js. -->
<div class="chest-shell is-app" id="chestShell">
  <aside class="chest-sidebar">
    <button type="button" class="chest-sidebar__toggle" id="sidebarToggle" title="Ouvrir ou fermer le menu" aria-label="Ouvrir ou fermer le menu">
      <svg class="chest-sidebar__toggle-bg" viewBox="0 0 22 112" preserveAspectRatio="none"><path d="M0 0 C 0 22, 21 30, 21 56 C 21 82, 0 90, 0 112"></path></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="chest-sidebar__label"><span>Navigation</span></div>
    <nav class="chest-nav">
      <a href="#/dashboard" data-page="dashboard" class="chest-nav__item"><span class="chest-nav__ic chest-ic-dashboard"></span><span class="chest-nav__item-label">Dashboard</span><span class="chest-nav__mark"></span></a>
      <a href="#/backtesting" data-page="backtesting" class="chest-nav__item"><span class="chest-nav__ic chest-ic-backtesting"></span><span class="chest-nav__item-label">Backtesting</span><span class="chest-nav__mark"></span></a>
      <a href="#/journal" data-page="journal" class="chest-nav__item"><span class="chest-nav__ic chest-ic-journal"></span><span class="chest-nav__item-label">Journal</span><span class="chest-nav__mark"></span></a>
      <a href="#/strategies" data-page="strategies" class="chest-nav__item"><span class="chest-nav__ic chest-ic-strategies"></span><span class="chest-nav__item-label">Stratégies</span><span class="chest-nav__mark"></span></a>
      <a href="#/calendar" data-page="calendar" class="chest-nav__item"><span class="chest-nav__ic chest-ic-calendar"></span><span class="chest-nav__item-label">Calendrier</span><span class="chest-nav__mark"></span></a>
      <a href="#/berich" data-page="berich" class="chest-nav__item"><span class="chest-nav__ic chest-ic-berich"></span><span class="chest-nav__item-label">BERICH</span><span class="chest-nav__mark"></span></a>
      <a href="#/school" data-page="school" class="chest-nav__item"><span class="chest-nav__ic chest-ic-school"></span><span class="chest-nav__item-label">School</span><span class="chest-nav__mark"></span></a>
    </nav>
    <div class="chest-sidebar__account">
      <div class="chest-sidebar__account-label">Compte</div>
      <div class="chest-sidebar__account-row">
        <span class="chest-sidebar__account-avatar" id="sidebarUserAvatar">—</span>
        <span style="min-width:0"><span class="chest-sidebar__account-name" id="sidebarUserName">—</span><span class="chest-sidebar__account-meta" id="sidebarUserEmail"></span></span>
      </div>
      <button type="button" class="chest-sidebar__logout" data-logout title="Se déconnecter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:15px;height:15px;flex-shrink:0"><path d="M15 17l5-5-5-5M20 12H9M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="chest-sidebar__logout-text">Se déconnecter</span>
      </button>
    </div>
  </aside>
  <div class="chest-sidebar-overlay" id="sidebarOverlay"></div>

  <div class="chest-main">
    <header class="chest-topbar">
      <button type="button" class="chest-topbar__menu" id="topbarMenuBtn" aria-label="Ouvrir le menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
      </button>
      <a href="#/dashboard" class="brand"><img src="assets/logo-chest.png" alt=""><span>CHEST</span></a>
      <div class="chest-crumb" id="crumb" aria-live="polite">
        <span class="chest-crumb__cat" id="crumbCat">Suivi</span>
        <span class="chest-crumb__sep">/</span>
        <b id="crumbPage">Dashboard</b>
      </div>
      <div class="chest-topbar__actions">
        <a href="#/admin-members" class="chest-topbar__btn chest-topbar__btn--round" data-page="admin-members" data-admin-only hidden aria-label="Membres (admin)" title="Gestion des membres">A</a>
        <a href="#/account" class="chest-topbar__btn" data-page="account" aria-label="Compte" title="Compte">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:17px;height:17px"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.9-3.4 3.8-5.4 7.2-5.4s6.3 2 7.2 5.4" stroke-linecap="round"/></svg>
        </a>
      </div>
      <div class="chest-progress" id="viewProgress"></div>
    </header>

    <div class="chest-view">
      <iframe id="chestView" title="Contenu" src="about:blank"></iframe>
    </div>
  </div>
</div>

<div class="wel" id="chestWelcome" role="dialog" aria-label="Bienvenue" hidden>
  <div class="wel__scroll" id="welScroll" tabindex="-1">
    <section class="wel__page">
      <canvas class="wel__stars" id="welStars" aria-hidden="true"></canvas>
      <div class="wel__glow" aria-hidden="true"></div>
      <div class="wel__vignette" aria-hidden="true"></div>
      <div class="wel__inner">
        <img class="wel__logo" src="assets/logo-chest.png" alt="CHEST">
        <p class="wel__eyebrow" id="welHello">Bonjour</p>
        <h1 class="wel__title"><span>Welcome</span><em id="welName"></em></h1>
        <p class="wel__sub">Ton espace CHEST : suivi, backtests, journal, marchés et formation, au même endroit.</p>
        <div class="wel__news" id="welNews"><b>Nouveautés</b> les informations arrivent ici</div>
      </div>
      <button type="button" class="wel__cue" id="welCue" aria-label="Entrer dans le dashboard"><span>Scroll</span><i></i></button>
    </section>
    <div class="wel__spacer" aria-hidden="true"></div>
  </div>
</div>

<script src="js/nav.js?v=3"></script>
<script src="js/shell.js?v=2"></script>
<script src="js/welcome.js?v=2"></script>
</body>
</html>
