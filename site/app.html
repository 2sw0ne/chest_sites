<!DOCTYPE html>
<html lang="fr" class="is-shell">
<head>
<meta charset="UTF-8">

<!-- Fond sombre IMMÉDIAT, avant toute feuille de style externe (retour utilisateur 2026-09-23 : « on a un
     bug au chargement, je veux vraiment garder le visuel fluide sur le fond, pas ce sentiment que ça
     charge ») : sans ça, le navigateur affiche un blanc par défaut tant que les polices Google Fonts (une
     requête réseau externe, potentiellement lente) et les CSS locales n'ont pas fini de charger, puisqu'un
     <link rel="stylesheet"> bloque le premier rendu de toute la page. Ce style inline n'a besoin d'aucun
     fichier externe : il s'applique donc dès l'analyse du <head>. -->
<style>html,body{background:#050505}</style>
<!-- Cache le shell UNIQUEMENT le temps que welcome.js démarre (retour utilisateur 2026-09-23 : « ça ouvre 1
     sec le dashboard et ça revient, le welcome apparaît ») : `#chestWelcome` porte `hidden` en dur dans le
     HTML, retiré seulement par welcome.js (chargé après tout le reste du <body>) — le temps qu'il s'exécute,
     le shell était le premier contenu visible. `wel-boot-hide` (classe TEMPORAIRE, retirée par `show()` dès
     qu'il tourne, voir welcome.js) ferme cette fenêtre SANS jamais rester posée pendant tout le défilement —
     bug du 1er correctif (2026-09-23, retour : « je vois plus le dashboard quand je scroll, c'est tout noir,
     c'est en arrivant en bas que je le vois ») : la classe utilisée alors (`is-welcome`) reste active pendant
     TOUT le défilement de Welcome (jusqu'à `finish()`, tout en bas), donc le shell restait cache noir pendant
     toute la descente au lieu d'apparaître progressivement sous la Newsletter comme prévu. -->
<script>
  try {
    if (sessionStorage.getItem('chest_welcome') === '1') {
      document.documentElement.classList.add('wel-boot-hide');
      // Filet de sécurité : si welcome.js ne tourne jamais (erreur, page modifiée...), ne jamais laisser le
      // shell caché pour de bon — 4 s est largement au-delà du temps normal de chargement.
      setTimeout(() => document.documentElement.classList.remove('wel-boot-hide'), 4000);
    }
  } catch (e) {}
  // EXPÉRIMENTATION (branche experiment/merge-login-welcome, 2026-09-23, demande utilisateur : « éviter
  // ces chargements pour avoir un seul élément compact ») : connexion intégrée à app.html au lieu d'une
  // vraie page séparée (login.html) — plus de gel visuel entre "se connecter" et "voir Welcome", puisque
  // c'est le MÊME document du début à la fin. Vérifié directement en localStorage/sessionStorage (même
  // logique que CHESTAccounts.getToken()) plutôt que d'attendre accounts-auth.js, pour poser la classe
  // avant même l'analyse du <body> — même intention que `wel-boot-hide` juste au-dessus.
  // login.html/signup.html restent des fichiers à part, inchangés : ce sont le repli de compatibilité
  // (session perdue en cours d'usage dans une page de l'iframe, lien direct, favori) — voir shell.js et
  // theme.js, non modifiés pour ce cas-là.
  try {
    const hasToken = !!(localStorage.getItem('chest_account_token') || sessionStorage.getItem('chest_account_token'));
    if (!hasToken) document.documentElement.classList.add('is-loggedout');
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Polices en chargement non bloquant (motif "loadCSS") : le rendu ne les attend plus, elles s'appliquent
     dès qu'elles arrivent (bascule media print -> all), au lieu de retarder le premier affichage. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@1&display=swap">

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@1&display=swap"></noscript>

<!-- ══════════════════════════════════════════════════════════════
     Connexion intégrée (expérimentation, branche experiment/merge-login-welcome) — visible uniquement
     quand <html> porte `is-loggedout` (posé par le script en tête du <head>, avant même l'analyse de ce
     <body>). 2e passe (demande utilisateur : « que le fond n'arrête jamais de tourner et que les
     éléments arrivent en fondu par-dessus ») : plus de fond/shader séparé ici — la carte se pose direct
     PAR-DESSUS le hero du Welcome (#welLight/#welStars, déjà en train de tourner, voir welcome.js), qui
     ne s'arrête donc jamais entre la connexion et Welcome. Au lieu de rediriger vers une page à part,
     ce même document bascule vers le VRAI Welcome une fois connecté (CHESTWelcome.show(), script en bas).
     ══════════════════════════════════════════════════════════════ -->
<div class="auth-overlay" id="authOverlay" aria-hidden="true">
  <div class="auth-stage" id="authStage">
    <div class="auth-card">
      <img class="auth-card__logo" src="assets/logo-chest-hero.webp" alt="CHEST">
      <h1>Bienvenue sur CHEST</h1>
      <p class="auth-card__lead">Ton prochain niveau t'attend.</p>

      <form id="authForm" autocomplete="off" novalidate>
        <div class="auth-field">
          <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M3 6l9 7 9-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <input id="authEmail" type="email" placeholder="Adresse e-mail" required autocomplete="username">
        </div>
        <div class="auth-field">
          <svg class="auth-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5" stroke-linecap="round"/></svg>
          <input id="authPassword" type="password" placeholder="Mot de passe" required autocomplete="current-password" style="padding-right:44px">
          <button type="button" class="auth-field__toggle" id="authPwToggle" aria-label="Afficher le mot de passe">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <div class="auth-row">
          <label class="auth-remember"><input type="checkbox" id="authRemember" checked> Se souvenir de moi</label>
          <button type="button" class="auth-forgot" id="authForgotBtn">Mot de passe oublié ?</button>
        </div>

        <p class="auth-error" id="authFormError"></p>
        <p class="auth-note" id="authFormNote"></p>

        <button type="submit" class="auth-submit" id="authSubmitBtn">
          <span id="authSubmitLabel">Se connecter</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>

      <p class="auth-footnote">Pas encore de compte ? <a href="signup.html">Créer un compte</a></p>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════
     Page « Welcome » — posée AVANT le shell, dans le même défilement.
     Hero, puis Newsletter, puis directement le dashboard : c'est le
     défilement natif de la page, le dashboard fait partie du flux.
     Une fois son sommet atteint, le calque disparaît (welcome.js) et
     on ne peut plus remonter.

     Photo d'une carte : renseigner --img sur .wel__card-media, ex.
       style="--img:url(/assets/news-school.jpg)"
     Chemin RACINE obligatoire (/assets/...), jamais relatif (assets/...) : un url()
     dans une variable CSS se résout depuis la feuille de style qui l'UTILISE
     (css/welcome.css), pas depuis app.html — un chemin relatif cherche alors
     dans css/assets/ et échoue en silence (404, dégradé de repli affiché).
     Le texte d'attente disparaît seul. Le contenu détaillé (fenêtre
     qui s'ouvre au clic) est dans .wel__card-full.
     data-news-id alimente le +N rouge du bouton Newsletter.
     ══════════════════════════════════════════════════════════════ -->

        </div>

        <div class="wel__handoff" aria-hidden="true">
          <svg class="wel__handoff-arrows" viewBox="0 0 24 24" width="24" height="24" fill="none">

<script>
(() => {
  // Connexion intégrée (expérimentation) : câblage du formulaire de #authOverlay. Repris de
  // login.html, adapté pour rester DANS app.html au lieu de rediriger — voir le commentaire en
  // tête du <head> et celui au-dessus de #authOverlay pour le pourquoi. Plus de fond propre à
  // câbler ici (voir welcome.js/welcome.css) : le hero du Welcome tourne déjà derrière.
  if (!document.documentElement.classList.contains('is-loggedout')) return; // deja connecte : rien a faire

  const form = document.getElementById('authForm');
  const errEl = document.getElementById('authFormError');
  const noteEl = document.getElementById('authFormNote');
  const submitBtn = document.getElementById('authSubmitBtn');
  const submitLabel = document.getElementById('authSubmitLabel');
  const stage = document.getElementById('authStage');

  document.getElementById('authPwToggle').addEventListener('click', () => {
    const input = document.getElementById('authPassword');
    const btn = document.getElementById('authPwToggle');
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    btn.setAttribute('aria-label', showing ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
  });
  document.getElementById('authForgotBtn').addEventListener('click', () => {
    errEl.textContent = '';
    noteEl.textContent = "La réinitialisation par e-mail n'est pas encore branchée — contacte l'administrateur pour remettre ton mot de passe à zéro.";
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.textContent = '';
    noteEl.textContent = '';
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const remember = document.getElementById('authRemember').checked;

    submitBtn.disabled = true;
    submitLabel.textContent = 'Connexion…';
    try {
      await CHESTAccounts.login({ email, password, remember });
      try { sessionStorage.setItem('chest_welcome', '1'); } catch (e) { /* tant pis */ }
      // Fondu de la carte (1,2 s) PUIS bascule vers Welcome — toujours le MEME document ET le MEME
      // fond (voir welcome.js/welcome.css, plus de shader separe a arreter ici), donc ni gel de
      // chargement ni saut visuel entre les deux.
      stage.classList.add('is-leaving');
      setTimeout(() => {
        document.documentElement.classList.remove('is-loggedout');
        document.getElementById('authOverlay').style.display = 'none';
        if (window.CHESTShell) CHESTShell.boot();
        if (window.CHESTWelcome) CHESTWelcome.show();
        if (window.CHESTNav) { CHESTNav.refreshAccount(); CHESTNav.refreshAdminVisibility(); }
      }, 1250);
    } catch (err) {
      errEl.textContent = err.message;
      submitBtn.disabled = false;
      submitLabel.textContent = 'Se connecter';
    }
  });
})();
</script>
</body>
</html>
