<!DOCTYPE html>
<html lang="fr" class="is-shell">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHEST</title>
<!-- Fond sombre IMMÉDIAT, avant toute feuille de style externe (retour utilisateur 2026-09-23 : « on a un
     bug au chargement, je veux vraiment garder le visuel fluide sur le fond, pas ce sentiment que ça
     charge ») : sans ça, le navigateur affiche un blanc par défaut tant que les polices Google Fonts (une
     requête réseau externe, potentiellement lente) et les CSS locales n'ont pas fini de charger, puisqu'un
     <link rel="stylesheet"> bloque le premier rendu de toute la page. Ce style inline n'a besoin d'aucun
     fichier externe : il s'applique donc dès l'analyse du <head>. -->
<style>html,body{background:#050505}</style>
<!-- Cache le shell UNIQUEMENT le temps que welcome.js démarre (retour utilisateur 2026-09-23 : « ça ouvre 1
     sec le dashboard et ça revient, le welcome apparaît ») : `#chestWelcome` porte `hidden` en dur dans le
     HTML, retiré seulement par welcome.js (chargé après tout le reste du <body>) — le temps qu'il s'exécute,
     le shell était le premier contenu visible. `wel-boot-hide` (classe TEMPORAIRE, retirée par `show()` dès
     qu'il tourne, voir welcome.js) ferme cette fenêtre SANS jamais rester posée pendant tout le défilement —
     bug du 1er correctif (2026-09-23, retour : « je vois plus le dashboard quand je scroll, c'est tout noir,
     c'est en arrivant en bas que je le vois ») : la classe utilisée alors (`is-welcome`) reste active pendant
     TOUT le défilement de Welcome (jusqu'à `finish()`, tout en bas), donc le shell restait cache noir pendant
     toute la descente au lieu d'apparaître progressivement sous la Newsletter comme prévu. -->
<script>
  try {
    if (sessionStorage.getItem('chest_welcome') === '1') {
      document.documentElement.classList.add('wel-boot-hide');
      // Filet de sécurité : si welcome.js ne tourne jamais (erreur, page modifiée...), ne jamais laisser le
      // shell caché pour de bon — 4 s est largement au-delà du temps normal de chargement.
      setTimeout(() => document.documentElement.classList.remove('wel-boot-hide'), 4000);
    }
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Polices en chargement non bloquant (motif "loadCSS") : le rendu ne les attend plus, elles s'appliquent
     dès qu'elles arrivent (bascule media print -> all), au lieu de retarder le premier affichage. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@1&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@1&display=swap"></noscript>
<link rel="stylesheet" href="css/tokens.css?v=2">
<link rel="stylesheet" href="css/layout.css?v=3">
<link rel="stylesheet" href="css/chest-da.css?v=13">
<link rel="stylesheet" href="css/patch-chest-da.css?v=13">
<link rel="stylesheet" href="css/welcome.css?v=27">
<script src="js/theme.js"></script>
<script src="js/config.js"></script>
<script src="js/config.local.js"></script>
<script src="js/accounts-auth.js"></script>
<script>CHESTAccounts.guard();</script>
</head>
<body class="chest-root">

<!-- ══════════════════════════════════════════════════════════════
     Page « Welcome » — posée AVANT le shell, dans le même défilement.
     Hero, puis Newsletter, puis directement le dashboard : c'est le
     défilement natif de la page, le dashboard fait partie du flux.
     Une fois son sommet atteint, le calque disparaît (welcome.js) et
     on ne peut plus remonter.

     Photo d'une carte : renseigner --img sur .wel__card-media, ex.
       style="--img:url(/assets/news-school.jpg)"
     Chemin RACINE obligatoire (/assets/...), jamais relatif (assets/...) : un url()
     dans une variable CSS se résout depuis la feuille de style qui l'UTILISE
     (css/welcome.css), pas depuis app.html — un chemin relatif cherche alors
     dans css/assets/ et échoue en silence (404, dégradé de repli affiché).
     Le texte d'attente disparaît seul. Le contenu détaillé (fenêtre
     qui s'ouvre au clic) est dans .wel__card-full.
     data-news-id alimente le +N rouge du bouton Newsletter.
     ══════════════════════════════════════════════════════════════ -->
<div class="wel" id="chestWelcome" aria-label="Bienvenue" hidden>

  <div id="welScroll">

    <!-- ─── 1 · Le hero ─── -->
    <section class="wel__page wel__hero">
      <canvas class="wel__light" id="welLight" aria-hidden="true"></canvas>
      <canvas class="wel__stars" id="welStars" aria-hidden="true"></canvas>
      <div class="wel__vignette" aria-hidden="true"></div>

      <div class="wel__stage">
        <img class="wel__logo" src="assets/logo-chest-hero.webp" alt="">
        <h1 class="wel__title"><span>Welcome</span><em id="welName"></em></h1>
        <p class="wel__say" id="welSay" aria-live="off"><span class="wel__say-sr" id="welSaySr"></span><span class="wel__say-fx" id="welSayFx" aria-hidden="true"></span></p>
        <div class="wel__actions">
          <button type="button" class="wel__btn wel__btn--ghost" id="welNewsBtn" data-count="0">
            <span>Newsletter</span><i class="wel__badge" id="welBadge" aria-hidden="true">+0</i>
          </button>
          <button type="button" class="wel__btn wel__btn--main" id="welStart">Start</button>
        </div>
      </div>

    </section>

    <!-- ─── 2 · Newsletter ─── -->
    <section class="wel__page wel__page--news" id="welNews">
      <div class="wel__glow" aria-hidden="true"></div>

      <div class="wel__news-wrap">
        <div class="wel__news-head">
          <p class="wel__kicker">Nouveautés</p>
          <h2 class="wel__h2">Newsletter</h2>
          <!-- Réglage manuel de la disposition des 5 vitrines (provisoire : accessible à tous en attendant le
               vrai réglage Admin/Client — voir CLAUDE.md). Stocké en localStorage, par navigateur. -->
          <button type="button" class="wel__layout-toggle" id="welLayoutToggle">Recadrer</button>
          <button type="button" class="wel__layout-toggle" id="welLayoutReset" hidden>Réinitialiser</button>
        </div>

        <div class="wel__grid wel__grid--v2" id="welBentoGrid">

          <!-- CHEST IS HERE : vitrine statique, même esprit que la carte "Presentations" de référence -->
          <article class="wel__card wel__card--v2 wel__card--hero" data-no-sheet="1" data-bento-id="hero">
            <div class="wel__card-media" style="--img:url(/assets/wel-chest-here.webp)"></div>
            <h3 class="wel__card-title">Chest Is Here</h3>
          </article>

          <!-- SCANNER : porte le badge +1 de nouveauté (compté par le bouton Newsletter du hero) -->
          <article class="wel__card wel__card--v2 wel__card--scanner" data-no-sheet="1" data-news-id="scanner-2026-09" data-bento-id="scanner">
            <div class="wel__card-media" style="--img:url(/assets/wel-scanner.webp)"></div>
            <span class="wel__card-badge">+1</span>
            <h3 class="wel__card-title">Scanner</h3>
          </article>

          <!-- Founder : le téléphone recule et se floute au survol, les réseaux apparaissent derrière -->
          <article class="wel__card wel__card--v2 wel__card--founder" data-no-sheet="1" data-bento-id="founder">
            <h3 class="wel__card-title">Founder</h3>
            <div class="wel__founder-stage">
              <a class="wel__founder-social wel__founder-social--ig" href="https://instagram.com/2sw0ne" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>
              </a>
              <a class="wel__founder-social wel__founder-social--tt" href="#" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.4 2.2 1.9 3.8 4.4 4v3c-1.6.1-3-.4-4.4-1.3v6.6c0 3.5-2.8 6.2-6.3 6.2S4 18.8 4 15.3s2.8-6.2 6.3-6.2c.4 0 .8 0 1.2.1v3.2c-.4-.1-.8-.2-1.2-.2-1.7 0-3.1 1.4-3.1 3.1s1.4 3.1 3.1 3.1 3.2-1.3 3.2-3V3h3.1z"/></svg>
              </a>
              <a class="wel__founder-social wel__founder-social--tg" href="#" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 4L2.6 11.2c-.9.4-.9 1.6.1 1.9l4.6 1.4 1.8 5.6c.3.9 1.4 1.1 2 .4l2.6-2.8 4.7 3.5c.8.6 2 .2 2.2-.8L22 4.9c.2-1-.7-1.7-1.5-1.3z"/><path d="M8.3 14.5L17 7"/></svg>
              </a>
              <img class="wel__founder-phone" src="/assets/wel-founder-phone.webp" alt="Profil Instagram du fondateur">
            </div>
          </article>

          <!-- MENU : une bannière à la fois, qui se fond dans la suivante (une par page du site) -->
          <article class="wel__card wel__card--v2 wel__card--menu" data-no-sheet="1" data-bento-id="menu">
            <h3 class="wel__card-title">Menu</h3>
            <div class="wel__menu-stage" id="welMenuStage"></div>
          </article>

          <!-- SCHOOLE : miniatures vidéo de la rubrique School, défilement lent -->
          <article class="wel__card wel__card--v2 wel__card--school" data-no-sheet="1" data-bento-id="school">
            <h3 class="wel__card-title">Schoole</h3>
            <div class="wel__school-track">
              <div class="wel__school-track-inner" id="welSchoolTrack"></div>
            </div>
          </article>

        </div>

        <div class="wel__handoff">
          <b>Continue à descendre</b>
          <span>Ton dashboard arrive</span>
        </div>
      </div>
    </section>


  </div>

  <!-- Fenêtre d'une nouveauté (ouverte au clic sur une carte) -->
  <div class="wel__sheet" id="welSheet" role="dialog" aria-modal="true" aria-labelledby="welSheetTitle">
    <div class="wel__sheet-win">
      <button type="button" class="wel__sheet-close" data-wel-close aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
      <div class="wel__sheet-media" id="welSheetMedia"></div>
      <div class="wel__sheet-body">
        <span class="wel__sheet-tag" id="welSheetTag"></span>
        <h3 id="welSheetTitle"></h3>
        <div class="wel__sheet-text" id="welSheetText"></div>
        <div class="wel__sheet-date" id="welSheetDate"></div>
      </div>
    </div>
  </div>
</div>

<!-- Shell unique du site : la sidebar et la barre du haut vivent ICI, une
     seule fois. Chaque page (dashboard.html, calendar.html...) est chargée
     dans #chestView — elle ne recharge donc jamais le menu, seulement son
     propre contenu. Voir js/shell.js. -->
<div class="chest-shell is-app" id="chestShell">
  <aside class="chest-sidebar">
    <button type="button" class="chest-sidebar__toggle" id="sidebarToggle" title="Ouvrir ou fermer le menu" aria-label="Ouvrir ou fermer le menu">
      <svg class="chest-sidebar__toggle-bg" viewBox="0 0 22 112" preserveAspectRatio="none"><path d="M0 0 C 0 22, 21 30, 21 56 C 21 82, 0 90, 0 112"></path></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="chest-sidebar__label"><span>Navigation</span></div>
    <nav class="chest-nav">
      <a href="#/dashboard" data-page="dashboard" class="chest-nav__item"><span class="chest-nav__ic chest-ic-dashboard"></span><span class="chest-nav__item-label">Dashboard</span><span class="chest-nav__mark"></span></a>
      <a href="#/backtesting" data-page="backtesting" class="chest-nav__item"><span class="chest-nav__ic chest-ic-backtesting"></span><span class="chest-nav__item-label">Backtesting</span><span class="chest-nav__mark"></span></a>
      <a href="#/journal" data-page="journal" class="chest-nav__item"><span class="chest-nav__ic chest-ic-journal"></span><span class="chest-nav__item-label">Journal</span><span class="chest-nav__mark"></span></a>
      <a href="#/strategies" data-page="strategies" class="chest-nav__item"><span class="chest-nav__ic chest-ic-strategies"></span><span class="chest-nav__item-label">Stratégies</span><span class="chest-nav__mark"></span></a>
      <a href="#/calendar" data-page="calendar" class="chest-nav__item"><span class="chest-nav__ic chest-ic-calendar"></span><span class="chest-nav__item-label">Calendrier</span><span class="chest-nav__mark"></span></a>
      <a href="#/berich" data-page="berich" class="chest-nav__item"><span class="chest-nav__ic chest-ic-berich"></span><span class="chest-nav__item-label">BERICH</span><span class="chest-nav__mark"></span></a>
      <a href="#/school" data-page="school" class="chest-nav__item"><span class="chest-nav__ic chest-ic-school"></span><span class="chest-nav__item-label">School</span><span class="chest-nav__mark"></span></a>
    </nav>
    <div class="chest-sidebar__account">
      <div class="chest-sidebar__account-label">Compte</div>
      <div class="chest-sidebar__account-row">
        <span class="chest-sidebar__account-avatar" id="sidebarUserAvatar">—</span>
        <span style="min-width:0"><span class="chest-sidebar__account-name" id="sidebarUserName">—</span><span class="chest-sidebar__account-meta" id="sidebarUserEmail"></span></span>
      </div>
      <button type="button" class="chest-sidebar__logout" data-logout title="Se déconnecter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:15px;height:15px;flex-shrink:0"><path d="M15 17l5-5-5-5M20 12H9M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="chest-sidebar__logout-text">Se déconnecter</span>
      </button>
    </div>
  </aside>
  <div class="chest-sidebar-overlay" id="sidebarOverlay"></div>

  <div class="chest-main">
    <header class="chest-topbar">
      <button type="button" class="chest-topbar__menu" id="topbarMenuBtn" aria-label="Ouvrir le menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
      </button>
      <a href="#/dashboard" class="brand"><img src="assets/logo-chest.png" alt=""><span>CHEST</span></a>
      <div class="chest-crumb" id="crumb" aria-live="polite">
        <span class="chest-crumb__cat" id="crumbCat">Suivi</span>
        <span class="chest-crumb__sep">/</span>
        <b id="crumbPage">Dashboard</b>
      </div>
      <div class="chest-topbar__actions">
        <a href="#/admin-members" class="chest-topbar__btn chest-topbar__btn--round" data-page="admin-members" data-admin-only hidden aria-label="Membres (admin)" title="Gestion des membres">A</a>
        <a href="#/account" class="chest-topbar__btn" data-page="account" aria-label="Compte" title="Compte">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:17px;height:17px"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.9-3.4 3.8-5.4 7.2-5.4s6.3 2 7.2 5.4" stroke-linecap="round"/></svg>
        </a>
      </div>
      <div class="chest-progress" id="viewProgress"></div>
    </header>

    <div class="chest-view">
      <iframe id="chestView" title="Contenu" src="about:blank"></iframe>
    </div>
  </div>
</div>

<script src="js/nav.js?v=3"></script>
<script src="js/shell.js?v=2"></script>
<script src="js/welcome.js?v=48"></script>
</body>
</html>
