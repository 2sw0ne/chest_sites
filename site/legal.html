<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents légaux — CHEST</title>
<meta name="description" content="Conditions d’utilisation, conditions de vente, confidentialité, risques et mentions légales de CHEST.">
<link rel="icon" type="image/png" href="/assets/logo-chest.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/legal.css?v=5">
</head>
<body>
<!-- Documents légaux (2026-10-30) : page publique, sans connexion. /legal = sommaire, /legal/<doc> = un document
     (textes dans js/legal-docs.js). Lisible et imprimable (Imprimer → PDF). -->
<header class="lg-top">
  <a class="lg-brand" href="/connexion"><img src="/assets/logo-chest.png" alt="">CHEST</a>
  <a class="lg-back" href="/connexion">Retour à CHEST</a>
</header>
<div class="lg-wrap">
  <nav class="lg-nav" id="lgNav" aria-label="Documents"></nav>
  <main class="lg-doc" id="lgDoc"></main>
</div>
<footer class="lg-foot"><div data-legal-links></div><p>© 2026 CHEST</p></footer>
<script src="/js/legal-docs.js?v=4"></script>
<script>
(() => {
  'use strict';
  const L = window.CHESTLegal;
  let slug = (new URLSearchParams(location.search).get('doc') || (location.pathname.match(/^\/legal\/([\w-]+)/) || [])[1] || '').toLowerCase();
  // Programme éducateur et revenus des éducateurs : réunis dans la Charte de l'éducateur (2026-10-30).
  const OLD = { 'programme-educateur': ['charte-educateur', ''], 'revenus-educateurs': ['charte-educateur', '#revenus'] };
  if (OLD[slug]) { history.replaceState(null, '', `/legal/${OLD[slug][0]}${OLD[slug][1]}`); slug = OLD[slug][0]; }
  const doc = L.DOCS.find((d) => d.slug === slug);
  const date = new Date(L.LEGAL_VERSION + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('lgNav').innerHTML = `<span class="lg-nav__h">Documents</span>${L.DOCS.map((d) => `<a href="/legal/${d.slug}"${doc === d ? ' aria-current="page"' : ''}>${d.short}</a>`).join('')}`;
  const main = document.getElementById('lgDoc');
  if (!doc) {
    document.title = 'Documents légaux — CHEST';
    main.innerHTML = `<span class="lg-step">Documents légaux</span><h1>Les règles de CHEST, en clair</h1>
      <p class="lg-lead">Tout ce qui encadre ton compte, tes achats, tes données et le programme éducateur. Version du ${date}.</p>
      <div class="lg-cards">${L.DOCS.map((d, i) => `<a class="lg-card" href="/legal/${d.slug}"><span>${String(i + 1).padStart(2, '0')}</span><b>${d.title}</b><i>→</i></a>`).join('')}</div>`;
    return;
  }
  document.title = `${doc.title} — CHEST`;
  main.innerHTML = `<span class="lg-step">Documents légaux</span><h1>${doc.title}</h1>
    <p class="lg-meta">Version du ${date}<button type="button" class="lg-print" onclick="window.print()">Imprimer ou enregistrer en PDF</button></p>
    <article class="lg-body">${doc.html()}</article>`;
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  if (document.querySelector('.lg-todo')) document.body.classList.add('has-todo');
})();
</script>
<script src="/js/legal-links.js?v=2"></script>
</body>
</html>
