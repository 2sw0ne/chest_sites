<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STASH — Accès</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<script src="js/theme.js"></script>
</head>
<body>

<div class="gate">
  <div class="gate__glow" aria-hidden="true"></div>
  <div class="gate__card">
    <div class="gate__mark" aria-hidden="true"></div>
    <h1 id="gateTitle">STASH</h1>
    <p id="gateSub">Entre ton code d'accès pour continuer.</p>

    <form id="gateForm" autocomplete="off">
      <input id="gateCode" class="field gate__code" type="password" inputmode="numeric" maxlength="12" placeholder="••••" autofocus>
      <p class="gate__error" id="gateError"></p>
      <button type="submit" class="btn btn-primary gate__submit">Continuer</button>
    </form>

    <p class="gate__footnote" id="gateFootnote">Filtre d'accès local — le code est stocké uniquement sur cet appareil.</p>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
(() => {
  const codeEl = document.getElementById('gateCode');
  const errEl = document.getElementById('gateError');
  const formEl = document.getElementById('gateForm');

  (async () => {
    if (!STASHAuth.hasCode()) {
      await STASHAuth.setCode('2123'); // code par défaut, modifiable dans Compte
    }
    if (STASHAuth.isUnlocked()) {
      window.location.replace('dashboard.html');
    }
  })();

  formEl.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = codeEl.value.trim();
    errEl.textContent = '';

    const ok = await STASHAuth.checkCode(code);
    if (ok) {
      STASHAuth.unlock();
      window.location.href = 'dashboard.html';
    } else {
      errEl.textContent = 'Code incorrect.';
      codeEl.value = '';
      codeEl.focus();
    }
  });
})();
</script>
</body>
</html>
