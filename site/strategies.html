<style>html,body{background:#050505}  /* Fenêtre d'opportunité ouverte depuis une notification (2026-10-06) */
  .alr-modal{ position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center; padding:16px;
    background:rgba(5,5,5,.42); backdrop-filter:blur(16px) brightness(.7); -webkit-backdrop-filter:blur(16px) brightness(.7); }
  .alr-modal.is-open{ display:flex; }
  .alr-modal__card{ width:min(420px,100%); border-radius:20px; padding:24px; text-align:center;
    border:1px solid rgba(255,255,255,.14); background:linear-gradient(160deg,rgba(44,44,50,.92),rgba(12,12,14,.94));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 30px 80px rgba(0,0,0,.6); }
  .alr-modal__logo{ width:72px; height:72px; object-fit:contain; margin:0 auto 12px; display:block; }
  .alr-modal__side{ font-size:28px; font-weight:900; letter-spacing:.04em; margin-top:4px; }
  .alr-modal__side.is-buy{ color:#33e6a6; text-shadow:0 0 22px rgba(51,230,166,.45); }
  .alr-modal__side.is-sell{ color:#ff4d5e; text-shadow:0 0 22px rgba(255,77,94,.45); }
  .alr-modal__text{ font-size:15px; margin:8px 0 20px; color:var(--ink); }
  .alr-modal__btns{ display:flex; gap:8px; justify-content:center; }
  /* Cartes d'opportunités v2 (2026-10-06) : carré simple, lueur derrière le signal, niveaux colorés */
  .alr-card{ flex:0 0 150px; height:96px; position:relative; overflow:hidden; align-items:center; justify-content:center; text-align:center; gap:4px; padding:6px 6px; }
  .alr-card::before{ content:''; position:absolute; left:50%; top:50%; width:84px; height:84px; transform:translate(-50%,-50%); border-radius:50%; filter:blur(14px); opacity:.55; z-index:0; pointer-events:none; }
  .alr-card.is-buy::before{ background:radial-gradient(circle, rgba(51,230,166,.55), rgba(51,230,166,0) 70%); }
  .alr-card.is-sell::before{ background:radial-gradient(circle, rgba(255,77,94,.6), rgba(255,77,94,0) 70%); }
  .alr-card > *{ position:relative; z-index:1; }
  .alr-card__logo{ width:22px; height:22px; }
  .alr-card__side{ font-size:12px; font-weight:900; letter-spacing:.04em; }
  .alr-card__meta{ font-size:9px; line-height:1; }
  .alr-card__levels{ font-size:9px; font-weight:700; letter-spacing:0; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .alr-card__levels .sl{ color:#ff4d5e; }
  .alr-card__levels .pe{ color:#9b9ba1; }
  .alr-card__levels .tp{ color:#33e6a6; }
  .alr-card__levels .bar{ color:#5c5c63; margin:0 3px; }
</style>

<style>
  [hidden]{ display:none !important; }

  /* ================= Barre de contrôle ================= */
  .scnr-topbar{ display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; padding:12px 16px; margin-bottom:12px; }
  .page-head{ margin-bottom:16px; }
  .scnr-field{ min-width:150px; }
  .scnr-field label{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin-bottom:6px; }
  .scnr-field select{
    width:100%; height:38px; border:1px solid var(--line2); border-radius:9px; background:var(--bg); color:var(--ink);
    font:inherit; font-size:12.5px; padding:0 10px; cursor:pointer;
  }
  .scnr-tf{ display:flex; height:38px; border:1px solid var(--line2); border-radius:9px; overflow:hidden; background:var(--bg); }
  .scnr-tf button{ flex:1; border:none; background:transparent; color:var(--muted); font:inherit; font-size:11px; font-weight:800; cursor:pointer; padding:0 8px; }
  .scnr-tf button + button{ border-left:1px solid var(--line2); }
  .scnr-tf button.is-active{ background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; }

  /* Sélecteur de scanner — même famille visuelle que le switcher de compte */
  .scnr-combo{ position:relative; min-width:220px; }
  .scnr-combo__trigger{
    width:100%; height:38px; display:flex; align-items:center; gap:8px; border:1px solid var(--line2); border-radius:9px;
    background:var(--bg); color:var(--ink); font:inherit; font-size:12.5px; font-weight:700; padding:0 10px; cursor:pointer;
  }
  .scnr-combo__trigger .chev{ margin-left:auto; color:var(--muted); font-size:11px; font-weight:400; }
  .scnr-logo{
    width:22px; height:22px; border-radius:7px; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
    font-size:9.5px; font-weight:800; color:#fff; letter-spacing:-.02em; vertical-align:middle;
  }
  .scnr-logo-img{ flex-shrink:0; display:inline-block; object-fit:contain; vertical-align:middle; }
  .scnr-trigger-inner{ display:inline-flex; align-items:center; gap:8px; }
  .scnr-menu{
    position:absolute; z-index:40; top:calc(100% + 6px); left:0; width:260px; background:var(--panel);
    border:1px solid var(--line2); border-radius:var(--radius-sm); box-shadow:0 20px 48px rgba(0,0,0,.3); padding:6px; display:none;
    /* Liste défilante : hauteur max sur l'écran, barre de défilement discrète */
    max-height:min(420px, 62vh); overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:thin; scrollbar-color:var(--line2) transparent;
  }
  .scnr-menu.is-open{ display:block; }
  .scnr-menu__item{ display:flex; align-items:center; gap:10px; width:100%; border:none; background:transparent; cursor:pointer; padding:8px 10px; border-radius:8px; text-align:left; font:inherit; color:var(--ink); }
  .scnr-menu__item:hover{ background:var(--panel-2); }
  .scnr-menu__item.is-active{ background:var(--panel-2); }
  .scnr-menu__item strong{ display:block; font-size:12.5px; }
  .scnr-menu__item span{ display:block; font-size:10.5px; color:var(--muted); }

  /* ================= Graphique — pleine largeur ================= */
  .scnr-media{ overflow:hidden; margin-bottom:16px; border-top-left-radius:0; border-top-right-radius:0; }
  /* La barre d'onglets vit maintenant DANS le hero sombre (juste sous le nom
     du scanner), pas dans une carte separee - retour direct utilisateur
     (2026-09-14) : evite la coupure nette entre la lueur neon et un bloc de
     fond clair juste en dessous. Style hero-specifique (jamais var(--bg),
     qui suit le theme clair/sombre du site alors que le hero reste toujours
     sombre) plutot que la version "carte normale" du tabbar. */
  .scnr-hero .scnr-media__tabs{ display:flex; justify-content:center; margin-top:24px; }
  .scnr-hero .scnr-tabbar{ background:rgba(255,255,255,.06); }
  .scnr-hero .scnr-tabbar button{ color:rgba(255,255,255,.6); }
  .scnr-hero .scnr-tabbar button.is-active{ background:#fff; color:#0a0a0d; }
  .scnr-tabbar{ display:inline-flex; gap:4px; padding:4px; border-radius:999px; }
  .scnr-tabbar button{ border:none; cursor:pointer; font:inherit; font-size:12.5px; font-weight:600; padding:7px 15px; border-radius:999px; background:transparent; color:var(--muted); transition:background .15s, color .15s; }
  .scnr-tabbar button.is-active{ background:var(--ink); color:var(--bg); }
  .scnr-panel{ display:none; }
  .scnr-panel.is-active{ display:block; }
  #scnrChart{ height:min(85vh,860px); min-height:520px; }
  .scanner-empty{ display:flex; align-items:center; justify-content:center; height:100%; min-height:420px; color:var(--muted); font-size:13.5px; text-align:center; padding:20px; }

  .scnr-desc{ font-size:13px; color:var(--muted); line-height:1.6; padding:14px 18px 18px; }
  .scnr-tags{ display:flex; gap:6px; flex-wrap:wrap; padding:0 18px 18px; }
  .scnr-tags span{ font-size:11px; padding:4px 9px; border-radius:6px; background:var(--panel-2); color:var(--blue); }

  /* ================= Hero du scanner actif — logo + nom en grand, fond neon
     derive du logoColor (scanner-store.js), meme principe que .sentiment-hero
     du calendrier (breakout pleine largeur, lueur radiale, toujours sombre
     independamment du theme du site) mais teinte propre a chaque scanner
     plutot qu'un binaire haussier/baissier. Couleurs dupliquees ici depuis
     logoColor (regles par data-scanner, pas de variables CSS partagees entre
     les deux fichiers) — a garder synchronise si un logoColor change dans
     scanner-store.js. ================= */
  .scnr-hero{
    position:relative; overflow:hidden; text-align:center;
    padding:clamp(40px,6vh,64px) 24px 28px;
  }
  .scnr-hero::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 55% 65% at 50% 22%, var(--glow, rgba(140,140,160,.4)), transparent 72%);
    transition:background .5s ease;
  }
  /* Fondu de sortie vers le fond reel de la page - sans ca, la lueur radiale
     (deja assombrie a ses bords, voir ::before) rencontre le fond de page
     (var(--bg)) en une ligne nette, visible surtout aux coins gauche/droite
     ou la lueur n'apporte plus rien (retour direct utilisateur du
     2026-09-16, capture entouree en rose). Hauteur en clamp() : plus le
     viewport est grand, plus le fondu est genereux. */
  .scnr-hero::after{
    content:''; position:absolute; left:0; right:0; bottom:0; pointer-events:none;
    height:clamp(40px,10vh,120px); background:linear-gradient(180deg, transparent, var(--bg));
  }
  .scnr-hero[data-scanner="wolfx"]{ --glow: rgba(84,112,194,.5); }
  .scnr-hero[data-scanner="algomni"]{ --glow: rgba(249,164,94,.5); }
  .scnr-hero[data-scanner="swyper-v6"]{ --glow: rgba(132,45,255,.5); }
  .scnr-hero[data-scanner="nexus"]{ --glow: rgba(255,122,26,.5); }
  .scnr-hero[data-scanner="harmonics"]{ --glow: rgba(0,230,138,.5); }
  .scnr-hero[data-scanner="blood"]{ --glow: rgba(255,45,45,.5); }
  .scnr-hero[data-scanner="pulse"]{ --glow: rgba(45,123,255,.5); }
  .scnr-hero[data-scanner="wave"]{ --glow: rgba(255,45,45,.5); }
  .scnr-hero[data-scanner="stars"]{ --glow: rgba(255,194,26,.5); }
  .scnr-hero[data-scanner="pivot"]{ --glow: rgba(51,230,166,.5); }
  .scnr-hero[data-scanner="supernova"]{ --glow: rgba(59,123,255,.5); }
  .scnr-hero__inner{ position:relative; max-width:520px; margin:0 auto; }
  .scnr-hero__logo-wrap{ display:inline-flex; margin-bottom:22px; }
  /* Pas de cadre ni de rayon : le logo occupe toute la case, son propre contour
     (détouré) fait office de bord. drop-shadow suit l'alpha du PNG, donc la lueur
     épouse la forme réelle du logo et non une boîte carrée. */
  .scnr-hero__logo{
    width:120px; height:120px; object-fit:contain; display:block;
    filter:drop-shadow(0 18px 34px var(--glow, rgba(0,0,0,.5)));
    transition:filter .5s ease;
  }
  .scnr-hero__logo-fallback{
    width:92px; height:92px; border-radius:26px; display:flex; align-items:center; justify-content:center;
    font-size:32px; font-weight:800; color:#fff;
    box-shadow:0 0 0 1px rgba(255,255,255,.1), 0 24px 56px -8px var(--glow, rgba(0,0,0,.5));
    transition:box-shadow .5s ease;
  }
  .scnr-hero__name{
    font-size:clamp(36px,6vw,60px); font-weight:800; letter-spacing:-.03em; line-height:1; margin:0 0 12px;
    background:linear-gradient(180deg,#fff,rgba(255,255,255,.55)); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .scnr-hero__tags{ font-size:13px; font-weight:600; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.06em; }

  /* ---- Opportunités + notifications (2026-10-06) ---- */
  .alr{ flex:1 1 360px; min-width:0; border-left:1px solid var(--line2); padding-left:16px; margin-left:4px; }
  .alr__head{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  .alr__eyebrow{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; }
  .alr__title{ font-size:15px; font-weight:800; margin-top:2px; }
  .alr__btn{ height:34px; padding:0 14px; border-radius:9px; border:1px solid var(--line2); background:var(--bg); color:var(--ink); font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
  .alr__btn:hover{ border-color:var(--acc); }
  .alr__btn--primary{ background:linear-gradient(135deg,var(--acc),var(--acc2)); border-color:transparent; color:#fff; }
  .alr__btn--danger{ color:#ff6b78; }
  .alr__btn:disabled{ opacity:.5; cursor:default; }
  .alr__cards{ display:flex; gap:10px; overflow-x:auto; padding:4px 2px 8px; scrollbar-width:thin; }
  .alr__empty{ font-size:12.5px; color:var(--muted); padding:10px 2px; }
  .alr-card{
    flex:0 0 150px; height:96px; border:1px solid var(--line2); border-radius:12px; background:var(--bg);
    padding:12px; cursor:pointer; text-align:left; font:inherit; color:var(--ink);
    display:flex; flex-direction:column; gap:6px; transition:transform .2s cubic-bezier(.16,1,.3,1), box-shadow .2s;
  }
  .alr-card:hover{ transform:translateY(-2px); }
  .alr-card__logo{ width:36px; height:36px; object-fit:contain; }
  .alr-card__name{ font-size:12.5px; font-weight:800; }
  .alr-card__meta{ font-size:10.5px; color:var(--muted); }
  .alr-card__side{ font-size:13px; font-weight:900; letter-spacing:.04em; }
  .alr-card.is-buy{ border-color:rgba(51,230,166,.45); box-shadow:0 0 26px rgba(51,230,166,.22), inset 0 0 22px rgba(51,230,166,.08); }
  .alr-card.is-buy .alr-card__side{ color:#33e6a6; }
  .alr-card.is-sell{ border-color:rgba(255,77,94,.5); box-shadow:0 0 26px rgba(255,77,94,.24), inset 0 0 22px rgba(255,77,94,.08); }
  .alr-card.is-sell .alr-card__side{ color:#ff4d5e; }
  .alr__settings{ margin-top:12px; border-top:1px solid var(--line2); padding-top:12px; }
  .alr__group{ margin-bottom:12px; }
  .alr__group > label{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; margin-bottom:6px; }
  .alr__chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .alr__chip{ height:30px; padding:0 11px; border-radius:999px; border:1px solid var(--line2); background:var(--bg); color:var(--muted); font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
  .alr__chip.is-on{ color:#fff; border-color:transparent; background:linear-gradient(135deg,var(--acc),var(--acc2)); }
  .alr__actions{ display:flex; gap:8px; justify-content:flex-end; }
  .alr__err{ font-size:12px; color:#ff6b78; min-height:16px; margin:8px 0 0; }
  .alr__rules{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .alr-rule{ display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid var(--line2); border-radius:12px; padding:10px 12px; background:var(--bg); }
  .alr-rule__text{ font-size:12.5px; line-height:1.45; }
  .alr-rule__text b{ font-weight:800; }
  .alr-rule__tools{ display:flex; gap:6px; flex-shrink:0; }
  .alr__status{ font-size:12px; color:var(--muted); margin-bottom:10px; }
</style>

<script>
(() => {
  'use strict';

  // ================= Marchés / paires — mêmes listes que le Journal, avec
  // conversion vers un format "BASE/QUOTE" générique (converti en instrument
  // OANDA "BASE_QUOTE" dans scanner-chart.js). Seules les paires qui se
  // convertissent proprement sont proposées (USOIL et DXY ne sont pas de
  // simples paires de devises — exclues pour l'instant plutôt que de risquer
  // un symbole invalide). =================
  function toSlashSymbol(code) {
    if (code.length === 6) return code.slice(0, 3) + '/' + code.slice(3);
    if (code.endsWith('USD') && code.length > 3) return code.slice(0, -3) + '/USD';
    return null;
  }

  const RAW_MARKETS = {
    forex: { label: 'Forex', codes: [
      'AUDCHF','AUDUSD','AUDCAD','AUDNZD','AUDJPY','EURGBP','EURCHF','EURUSD','EURCAD','EURAUD','EURNZD','EURJPY',
      'GBPCHF','GBPUSD','GBPCAD','GBPAUD','GBPNZD','GBPJPY','USDCHF','USDCAD','USDJPY','NZDCHF','NZDUSD','NZDCAD',
      'NZDJPY','CADCHF','CADJPY','CHFJPY',
    ] },
    commodities: { label: 'Matières premières', codes: ['XAUUSD', 'XAGUSD', 'XPTUSD'] },
    crypto: { label: 'Crypto', codes: ['BTCUSD', 'ETHUSD', 'SOLUSD', 'XRPUSD', 'TRXUSD', 'DOGEUSD', 'LINKUSD', 'ADAUSD', 'UNIUSD', 'AVAXUSD'] },
  };
  const MARKETS = {};
  Object.entries(RAW_MARKETS).forEach(([id, m]) => {
    MARKETS[id] = { label: m.label, pairs: m.codes.map((code) => [code, toSlashSymbol(code)]).filter(([, sp]) => sp) };
  });

  function populateMarketSelect(sel) {
    sel.innerHTML = Object.entries(MARKETS).map(([id, m]) => `<option value="${id}">${m.label}</option>`).join('');
  }
  function populateSymbolSelect(sel, marketId, selected) {
    const pairs = MARKETS[marketId] ? MARKETS[marketId].pairs : [];
    sel.innerHTML = pairs.map(([code]) => `<option value="${code}" ${code === selected ? 'selected' : ''}>${code}</option>`).join('');
  }
  function slashSymbolFor(marketId, code) {
    const pair = (MARKETS[marketId] ? MARKETS[marketId].pairs : []).find((p) => p[0] === code);
    return pair ? pair[1] : null;
  }

  populateMarketSelect(document.getElementById('scnrMarket'));

  // ================= État =================
  let currentScannerId = null;
  let currentMarket = 'commodities';
  let currentSymbol = 'XAUUSD';
  let currentTimeframe = '5';

  function activeScanner() { return CHESTScanners.get(currentScannerId); }

  function scannerLogoHtml(s, size) {
    if (s.logo) {
      return `<img class="scnr-logo-img" src="${s.logo}" alt="${s.name}" width="${size}" height="${size}" style="width:${size}px;height:${size}px">`;
    }
    return `<span class="scnr-logo" style="background:${s.logoColor};width:${size}px;height:${size}px;border-radius:${Math.round(size * .32)}px;font-size:${Math.round(size * .42)}px">${s.logoInitials}</span>`;
  }

  function renderScannerMenu() {
    const scanners = CHESTScanners.list();
    document.getElementById('scnrMenuList').innerHTML = scanners.map((s) => `
      <button type="button" class="scnr-menu__item ${s.id === currentScannerId ? 'is-active' : ''}" data-pick-scanner="${s.id}">
        ${scannerLogoHtml(s, 46)}
        <span><strong>${s.name}</strong><span>${(s.tags || []).join(' · ')}</span></span>
      </button>`).join('');
    document.querySelectorAll('[data-pick-scanner]').forEach((btn) => btn.addEventListener('click', () => {
      selectScanner(btn.dataset.pickScanner);
      document.getElementById('scnrMenu').classList.remove('is-open');
    }));
  }

  function selectScanner(id, opts) {
    const scanner = CHESTScanners.get(id);
    if (!scanner) return;
    currentScannerId = id;
    currentMarket = (opts && opts.market) || scanner.market || 'forex';
    currentSymbol = (opts && opts.symbol) || scanner.defaultSymbol || (MARKETS[currentMarket].pairs[0] || [])[0];
    currentTimeframe = (opts && opts.timeframe) || scanner.defaultTimeframe || '15';

    document.getElementById('scnrTriggerLabel').innerHTML = `<span class="scnr-trigger-inner">${scannerLogoHtml(scanner, 30)}<span>${scanner.name}</span></span>`;
    document.getElementById('scnrMarket').value = currentMarket;
    populateSymbolSelect(document.getElementById('scnrSymbol'), currentMarket, currentSymbol);
    document.querySelectorAll('#scnrTimeframe button').forEach((b) => b.classList.toggle('is-active', b.dataset.tf === currentTimeframe));

    if (window.CHESTScannerGuide) CHESTScannerGuide.render(document.getElementById('scnrGuide'), scanner);

    renderScannerHero(scanner);
    renderScannerMenu();
    renderChart();
  }

  // Hero plein écran au-dessus du graphique (même principe que le hero de
  // sentiment du calendrier) : logo + nom du scanner actif en grand, fond
  // néon dérivé de son logoColor via l'attribut data-scanner (regle CSS,
  // voir <style> — permet la transition douce sur le changement de scanner).
  function renderScannerHero(scanner) {
    document.getElementById('scnrHero').dataset.scanner = scanner.id;
    document.getElementById('scnrHeroLogoWrap').innerHTML = scanner.logo
      ? `<img class="scnr-hero__logo" src="${scanner.logo}" alt="${scanner.name}">`
      : `<span class="scnr-hero__logo-fallback" style="background:${scanner.logoColor}">${scanner.logoInitials}</span>`;
    document.getElementById('scnrHeroName').textContent = scanner.name; // CHEST 2.0 : le nom seul, comme la maquette
    document.getElementById('scnrHeroTags').textContent = (scanner.tags || []).join(' · ');
  }

  function renderChart() {
    const scanner = activeScanner();
    if (!scanner) return;
    const symbolPair = slashSymbolFor(currentMarket, currentSymbol);
    CHESTScannerChart.render({
      containerId: 'scnrChart',
      remote: true, // le script Pine tourne sur le serveur de calcul, jamais dans le navigateur
      pineSource: scanner.pineSource,
      secondaryPineSource: scanner.secondaryPineSource,
      extraPineSources: scanner.extraPineSources,
      fixedScale: scanner.fixedScale,
      symbolDisplay: currentSymbol,
      twelveDataSymbol: symbolPair, // Twelve Data attend aussi un symbole "BASE/QUOTE" (ex. "XAU/USD") - retour a Twelve Data (2026-09-14, OANDA abandonne : restriction EU)
      timeframe: currentTimeframe,
      candles: scanner.candles,
      scannerId: scanner.id,
    });
    if (!vizPop.hidden) renderViz();
    if (window.CHESTStrengthBoard) CHESTStrengthBoard.update({ scannerId: scanner.id, symbol: currentSymbol, tf: currentTimeframe });
    loadOpportunities();
  }

  // ================= Affichage du graphique (2026-10-18) =================
  // Interrupteurs lus et écrits par CHESTScannerChart.visuals : masquer un élément ne relance
  // aucun calcul serveur, le graphique se redessine sur place.
  const vizToggle = document.getElementById('vizToggle');
  const vizPop = document.getElementById('vizPop');
  function vizRow(item) {
    return `<li><button type="button" class="viz-row" role="switch" aria-checked="${item.on}" data-viz="${item.key}">
      <span class="viz-row__txt"><b>${item.label}</b>${item.hint ? `<small>${item.hint}</small>` : ''}</span>
      <span class="viz-sw" aria-hidden="true"></span>
    </button></li>`;
  }
  function renderViz() {
    const scanner = activeScanner();
    if (!scanner || !window.CHESTScannerChart || !CHESTScannerChart.visuals) return;
    const o = CHESTScannerChart.visuals.options(scanner.id);
    let n = 0;
    vizPop.innerHTML = `
      <div class="viz-pop__top"><h3>Affichage</h3><button type="button" class="viz-pop__reset" data-viz-reset>Réinitialiser</button></div>
      ${o.elements.length ? `<p class="viz-pop__k">0${++n} — Éléments du scanner</p><ul class="viz-pop__list">${o.elements.map(vizRow).join('')}</ul>` : ''}
      ${o.addons.length ? `<p class="viz-pop__k">0${++n} — Ajouter au graphique</p><ul class="viz-pop__list">${o.addons.map(vizRow).join('')}</ul>` : ''}
      <div class="viz-pop__foot"></div>`;
  }
  function setVizOpen(open) {
    vizPop.hidden = !open;
    vizToggle.setAttribute('aria-expanded', String(open));
    document.documentElement.classList.toggle('viz-open', open);
    if (open) renderViz();
  }
  vizToggle.addEventListener('click', (e) => { e.stopPropagation(); setVizOpen(vizPop.hidden); });
  vizPop.addEventListener('click', (e) => {
    e.stopPropagation();
    const scanner = activeScanner();
    if (!scanner) return;
    if (e.target.closest('[data-viz-reset]')) { CHESTScannerChart.visuals.reset(scanner.id); renderViz(); return; }
    const row = e.target.closest('[data-viz]');
    if (!row) return;
    const on = row.getAttribute('aria-checked') !== 'true';
    row.setAttribute('aria-checked', String(on));
    CHESTScannerChart.visuals.set(scanner.id, row.dataset.viz, on);
  });
  document.addEventListener('click', () => { if (!vizPop.hidden) setVizOpen(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !vizPop.hidden) { setVizOpen(false); vizToggle.focus(); } });

  // Volet « Force du marché » du scanner Pulse (js/strength-board.js) : clic sur une paire = on l'ouvre
  if (window.CHESTStrengthBoard) {
    CHESTStrengthBoard.mount({
      api: () => scannersApi(),
      headers: () => authHeaders(),
      onPick(code) {
        const market = Object.keys(MARKETS).find((id) => MARKETS[id].pairs.some((p) => p[0] === code));
        if (!market || code === currentSymbol) return;
        currentMarket = market;
        currentSymbol = code;
        document.getElementById('scnrMarket').value = market;
        populateSymbolSelect(document.getElementById('scnrSymbol'), market, code);
        renderChart();
      },
    });
  }

  document.getElementById('scnrTrigger').addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('scnrMenu').classList.toggle('is-open');
  });
  document.addEventListener('click', () => document.getElementById('scnrMenu').classList.remove('is-open'));
  document.getElementById('scnrMenu').addEventListener('click', (e) => e.stopPropagation());

  document.getElementById('scnrMarket').addEventListener('change', (e) => {
    currentMarket = e.target.value;
    currentSymbol = (MARKETS[currentMarket].pairs[0] || [])[0];
    populateSymbolSelect(document.getElementById('scnrSymbol'), currentMarket, currentSymbol);
    renderChart();
  });
  document.getElementById('scnrSymbol').addEventListener('change', (e) => {
    currentSymbol = e.target.value;
    renderChart();
  });
  document.getElementById('scnrTimeframe').querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', () => {
      currentTimeframe = btn.dataset.tf;
      document.querySelectorAll('#scnrTimeframe button').forEach((b) => b.classList.toggle('is-active', b === btn));
      renderChart();
    });
  });

  // ================= Onglets Graphique / À propos =================
  document.getElementById('scnrTabs').querySelectorAll('button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.getElementById('scnrTabs').querySelectorAll('button').forEach((b) => b.classList.toggle('is-active', b === btn));
      ['chart', 'about'].forEach((tab) => {
        document.getElementById('scnrPanel' + tab[0].toUpperCase() + tab.slice(1)).classList.toggle('is-active', tab === btn.dataset.tab);
      });
      // La vidéo explicative ne continue pas en fond quand on revient au graphique
      if (btn.dataset.tab !== 'about' && window.CHESTScannerGuide) CHESTScannerGuide.pause(document.getElementById('scnrGuide'));
    });
  });

  // ================= Opportunités + notifications (2026-10-06) =================
  const TF_LABELS = { '1': 'M1', '5': 'M5', '15': 'M15', '30': 'M30', '60': 'H1', '240': 'H4', 'D': 'D1' };
  const ALERT_TFS = Object.keys(TF_LABELS);
  function authHeaders() {
    const t = window.CHESTAccounts && CHESTAccounts.getToken && CHESTAccounts.getToken();
    return t ? { Authorization: 'Bearer ' + t } : {};
  }
  function timeAgo(ms) {
    const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
    if (m < 1) return "à l'instant";
    if (m < 60) return 'il y a ' + m + ' min';
    const h = Math.round(m / 60);
    if (h < 24) return 'il y a ' + h + ' h';
    return 'il y a ' + Math.round(h / 24) + ' j';
  }
  function setChips(el, attr, values) {
    el.querySelectorAll('.alr__chip').forEach((b) => b.classList.toggle('is-on', values.includes(b.dataset[attr])));
    updateDd(el.closest('.alr-dd'));
  }
  function updateDd(dd) {
    if (!dd) return;
    const on = [...dd.querySelectorAll('.alr__chip.is-on')].map((b) => b.textContent.trim());
    dd.querySelector('.alr-dd__value').textContent = !on.length ? 'Choisir' : on.length <= 2 ? on.join(', ') : on.length + ' sélectionnés';
  }
  function chosen(el, attr) {
    return [...el.querySelectorAll('.alr__chip.is-on')].map((b) => b.dataset[attr]);
  }

  function renderOpportunities(list) {
    // CHEST 2.0 : « Signal en cours » et « Derniers signaux » sous le graphique (js/strat-2.js)
    document.dispatchEvent(new CustomEvent('chest:scnr-opps', { detail: { list, scannerId: currentScannerId, symbol: currentSymbol, tf: currentTimeframe } }));
    const box = document.getElementById('alrLast');
    const mine = list.filter((o) => o.scanner === currentScannerId).sort((x, y) => y.time - x.time)[0];
    if (!mine) {
      box.className = 'alr-last alr-last--empty';
      box.innerHTML = '<span class="alr-last__empty">Aucune opportunité récente sur ce scanner.</span>';
      return;
    }
    const buy = mine.side === 'buy';
    const lv = mine.levels || {};
    const fmt = (v) => (Math.abs(v) >= 100 ? v.toFixed(2) : v.toFixed(5));
    const t = new Date(mine.time);
    const hh = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
    const tps = lv.tps || (lv.tp != null ? [lv.tp] : []);
    // Finalité : "active" tant que rien n'est touché, "tpN" dès que ce niveau est atteint (définitif
    // sauf à monter vers un TP plus loin), "sl" si le stop est touché avant tout TP.
    const stMatch = /^tp(\d+)$/.exec(mine.status || '');
    const status = !mine.status || mine.status === 'active'
      ? { label: 'ACTIF', cls: 'is-active' }
      : mine.status === 'sl'
      ? { label: 'SL TOUCHÉ', cls: 'is-sl' }
      : stMatch
      ? { label: 'TP' + stMatch[1] + ' ATTEINT', cls: 'is-tp', hitTp: Number(stMatch[1]) }
      : null;
    const field = (label, value, cls) => `<div class="alr-last__field"><span>${label}</span><b class="${cls}">${value}</b></div>`;
    let fields = '';
    if (lv.pe != null) fields += field('Entrée', fmt(lv.pe), 'pe');
    if (lv.sl != null) fields += field('Stop loss', fmt(lv.sl), 'sl' + (status && status.cls === 'is-sl' ? ' is-hit' : ''));
    tps.forEach((v, i) => {
      const hit = status && status.cls === 'is-tp' && status.hitTp === i + 1;
      fields += field(tps.length > 1 ? 'Take profit ' + (i + 1) : 'Take profit', fmt(v), 'tp' + (hit ? ' is-hit' : ''));
    });
    box.className = 'alr-last ' + (buy ? 'is-buy' : 'is-sell');
    box.innerHTML = `
      <div class="alr-last__head">
        <span class="alr-last__badge"><i></i>${buy ? 'ACHAT' : 'VENTE'}</span>
        <span class="alr-last__time">${hh} · ${timeAgo(mine.time)}</span>
      </div>
      <div class="alr-last__fields">${fields}</div>
      ${status ? `<span class="alr-last__status ${status.cls}">${status.label}</span>` : ''}`;
  }
  async function loadOpportunities() {
    try {
      const res = await fetch(`${scannersApi()}/alerts/signals?symbol=${encodeURIComponent(currentSymbol)}&tf=${encodeURIComponent(currentTimeframe)}`, { headers: authHeaders() });
      if (!res.ok) throw new Error('indisponible');
      const body = await res.json();
      renderOpportunities(body.opportunities || []);
    } catch (e) {
      document.getElementById('alrLast').innerHTML = '<div class="alr-last__empty">Opportunité indisponible pour le moment.</div>';
      document.dispatchEvent(new CustomEvent('chest:scnr-opps', { detail: { list: [], error: true, scannerId: currentScannerId, symbol: currentSymbol, tf: currentTimeframe } }));
    }
  }

  // Notifications : statut de l'appareil, règles enregistrées, formulaire
  async function refreshPushStatus() {
    const el = document.getElementById('alrStatus');
    let st = 'unsupported';
    try { st = await window.CHESTPwa.notificationStatus(); } catch (e) { /* navigateur sans service worker */ }
    if (st === 'enabled') el.textContent = 'Notifications actives sur cet appareil.';
    else if (st === 'disabled') el.innerHTML = 'Notifications non activées sur cet appareil. <button type="button" class="alr__btn" id="alrEnablePush">Activer</button>';
    else if (st === 'denied') el.textContent = 'Notifications bloquées dans le navigateur : à réactiver dans ses réglages.';
    else if (st === 'ios-install-required') el.textContent = "Sur iPhone, ajoute d'abord CHEST à l'écran d'accueil pour recevoir les notifications.";
    else el.textContent = "Ton navigateur ne supporte pas les notifications.";
    const b = document.getElementById('alrEnablePush');
    if (b) b.addEventListener('click', async () => {
      b.disabled = true;
      try { await window.CHESTPwa.enableNotifications(); } catch (e) { document.getElementById('alrErr').textContent = e.message; }
      refreshPushStatus();
    });
  }
  let alrRules = [];
  let alrEditing = null;
  async function loadRules() {
    const box = document.getElementById('alrRules');
    try {
      const res = await fetch(`${scannersApi()}/alerts/rules`, { headers: authHeaders() });
      alrRules = res.ok ? ((await res.json()).rules || []) : [];
    } catch (e) { alrRules = []; }
    if (!alrRules.length) { box.innerHTML = '<div class="alr__empty">Aucune notification configurée.</div>'; return; }
    box.innerHTML = alrRules.map((r) => {
      const names = r.scanners.map((id) => (CHESTScanners.get(id) || { name: id }).name).join(', ');
      return `<div class="alr-rule"><div class="alr-rule__text"><b>${r.pairs.join(', ')}</b> · ${r.timeframes.map((t) => TF_LABELS[t] || t).join(', ')}<br>${names}</div>
        <div class="alr-rule__tools"><button type="button" class="alr__btn" data-edit="${r.id}">Modifier</button><button type="button" class="alr__btn alr__btn--danger" data-del="${r.id}">Supprimer</button></div></div>`;
    }).join('');
    box.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => openForm(alrRules.find((r) => r.id === Number(b.dataset.edit)))));
    box.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', async () => {
      const ok = window.CHESTConfirm ? await CHESTConfirm('Supprimer cette notification ?') : window.confirm('Supprimer cette notification ?');
      if (!ok) return;
      b.disabled = true;
      let deleted = false;
      try {
        const res = await fetch(`${scannersApi()}/alerts/rules/${b.dataset.del}`, { method: 'DELETE', headers: authHeaders() });
        deleted = res.ok && (await res.json()).ok !== false;
      } catch (e) { deleted = false; }
      if (!deleted) {
        b.disabled = false;
        document.getElementById('alrErr').textContent = 'La notification n\'a pas pu être supprimée. Réessaie dans un instant.';
        return;
      }
      document.getElementById('alrErr').textContent = '';
      loadRules();
    }));
  }
  function openForm(rule) {
    alrEditing = rule ? rule.id : null;
    setChips(document.getElementById('alrPairs'), 'pair', rule ? rule.pairs : [currentSymbol]);
    setChips(document.getElementById('alrTfs'), 'tf', rule ? rule.timeframes : [currentTimeframe]);
    setChips(document.getElementById('alrScanners'), 'scanner', rule ? rule.scanners : [currentScannerId].filter(Boolean));
    document.getElementById('alrErr').textContent = '';
  }
  function buildChips() {
    const pairsEl = document.getElementById('alrPairs');
    const tfsEl = document.getElementById('alrTfs');
    const scEl = document.getElementById('alrScanners');
    pairsEl.innerHTML = Object.values(MARKETS).flatMap((m) => m.pairs.map(([code]) => code))
      .map((code) => `<button type="button" class="alr__chip" data-pair="${code}">${code}</button>`).join('');
    tfsEl.innerHTML = ALERT_TFS.map((tf) => `<button type="button" class="alr__chip" data-tf="${tf}">${TF_LABELS[tf]}</button>`).join('');
    scEl.innerHTML = CHESTScanners.list().map((s) => `<button type="button" class="alr__chip" data-scanner="${s.id}">${s.name}</button>`).join('');
    document.querySelectorAll('.alr-dd').forEach((dd) => {
      dd.querySelector('.alr-dd__trigger').addEventListener('click', (e) => {
        e.stopPropagation();
        const wasOpen = dd.classList.contains('is-open');
        document.querySelectorAll('.alr-dd.is-open').forEach((x) => x.classList.remove('is-open'));
        if (!wasOpen) dd.classList.add('is-open');
      });
      dd.querySelector('.alr-dd__menu').addEventListener('click', (e) => {
        const b = e.target.closest('.alr__chip');
        if (!b) return;
        b.classList.toggle('is-on');
        updateDd(dd);
      });
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.alr-dd')) document.querySelectorAll('.alr-dd.is-open').forEach((x) => x.classList.remove('is-open'));
    });
  }

  const alrOverlay = document.getElementById('alrOverlay');
  function openAlrModal() {
    alrOverlay.classList.add('is-open');
    refreshPushStatus();
    loadRules();
    openForm(null);
  }
  function closeAlrModal() { alrOverlay.classList.remove('is-open'); }
  document.getElementById('alrToggle').addEventListener('click', openAlrModal);
  document.getElementById('alrClose').addEventListener('click', closeAlrModal);
  alrOverlay.addEventListener('click', (e) => { if (e.target === alrOverlay) closeAlrModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAlrModal(); });
  document.getElementById('alrReset').addEventListener('click', () => openForm(null));
  document.getElementById('alrSave').addEventListener('click', async () => {
    const err = document.getElementById('alrErr');
    const btn = document.getElementById('alrSave');
    err.textContent = '';
    const body = {
      pairs: chosen(document.getElementById('alrPairs'), 'pair'),
      timeframes: chosen(document.getElementById('alrTfs'), 'tf'),
      scanners: chosen(document.getElementById('alrScanners'), 'scanner'),
    };
    if (alrEditing) body.id = alrEditing;
    btn.disabled = true;
    try {
      const res = await fetch(`${scannersApi()}/alerts/rules`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify(body),
      });
      const j = await res.json();
      if (!res.ok) throw new Error(j.error || 'Enregistrement impossible.');
      closeAlrModal();
      loadRules();
    } catch (e) {
      err.textContent = e.message;
    } finally {
      btn.disabled = false;
    }
  });

  setInterval(loadOpportunities, 60 * 1000);
  loadRules();

  // Ouverture depuis une notification : fenêtre floutée (?alert=1&side=buy|sell)
  function showAlertModal(deep) {
    const sc = CHESTScanners.get(deep.get('scanner'));
    const side = deep.get('side') === 'sell' ? 'sell' : 'buy';
    const sym = (deep.get('symbol') || '').toUpperCase();
    const tf = deep.get('tf') || '';
    if (!sc) return;
    const logo = document.getElementById('alrModalLogo');
    logo.src = sc.logo;
    logo.alt = sc.name;
    const sideEl = document.getElementById('alrModalSide');
    sideEl.textContent = side === 'buy' ? 'BUY' : 'SELL';
    sideEl.className = 'alr-modal__side ' + (side === 'buy' ? 'is-buy' : 'is-sell');
    document.getElementById('alrModalText').textContent = sc.name + ' · ' + (side === 'buy' ? 'BUY' : 'SELL') + ' détectée sur ' + sym + ' en ' + (TF_LABELS[tf] || tf) + ' !';
    const modal = document.getElementById('alrModal');
    modal.classList.add('is-open');
    document.getElementById('alrModalClose').onclick = () => modal.classList.remove('is-open');
    document.getElementById('alrModalOpen').onclick = () => {
      modal.classList.remove('is-open');
      document.getElementById('scnrMediaCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  }

  // ================= Démarrage =================
  // Le vrai Pine Script n'est plus dans scanner-store.js (repo public, voir son commentaire
  // d'en-tete) : on le recupere aupres du serveur de comptes, authentifie par le jeton de la
  // session en cours - un visiteur non connecte reste avec des scanners "vides" (menu/hero
  // affiches, mais graphique sans indicateur, voir CHESTScannerChart.render).
  function scannersApi() { return (window.CHEST_CONFIG && window.CHEST_CONFIG.accountsApiUrl) || 'http://localhost:8080'; }
  async function loadPineSources() {
    const token = window.CHESTAccounts && CHESTAccounts.getToken && CHESTAccounts.getToken();
    if (!token) return;
    try {
      const res = await fetch(scannersApi() + '/scanners', { headers: { Authorization: 'Bearer ' + token } });
      if (!res.ok) return;
      const body = await res.json();
      CHESTScanners.applyPineSource(body.scanners);
    } catch (e) { /* hors-ligne / serveur injoignable : le graphique restera sans indicateur */ }
  }

  const scanners = CHESTScanners.list();
  renderScannerMenu();
  const deep = new URLSearchParams(location.search);
  const deepScanner = deep.get('scanner');
  if (deepScanner && CHESTScanners.get(deepScanner)) {
    const sym = (deep.get('symbol') || '').toUpperCase();
    const mkt = Object.keys(MARKETS).find((id) => MARKETS[id].pairs.some((p) => p[0] === sym));
    selectScanner(deepScanner, { market: mkt, symbol: sym || undefined, timeframe: deep.get('tf') || undefined });
    // Après l'analyse de la page : la fenêtre est déclarée en bas du document
    if (deep.get('alert') === '1') setTimeout(() => showAlertModal(deep), 0);
    // depuis School (volet scanner de référence) : ouvrir directement l'onglet À propos
    if (deep.get('tab') === 'about') { const b = document.querySelector('#scnrTabs [data-tab="about"]'); if (b) b.click(); }
  } else if (scanners.length) {
    selectScanner(scanners[0].id);
  }
  buildChips();
  loadPineSources().then(() => { if (scanners.length) renderChart(); });
})();
</script>
<div class="alr-modal" id="alrModal" role="dialog" aria-modal="true" aria-labelledby="alrModalEyebrow">
  <div class="alr-modal__card">
    <img class="alr-modal__logo" id="alrModalLogo" alt="">
    <div class="alr__eyebrow" id="alrModalEyebrow">Nouvelle opportunité</div>
    <div class="alr-modal__side" id="alrModalSide"></div>
    <div class="alr-modal__text" id="alrModalText"></div>
    <div class="alr-modal__btns">
      <button type="button" class="alr__btn" id="alrModalClose">Fermer</button>
      <button type="button" class="alr__btn alr__btn--primary" id="alrModalOpen">Voir le graphique</button>
    </div>
  </div>
</div>
<script src="js/strat-2.js?v=1"></script>
<script src="js/v2.js?v=5"></script>
</body>
</html>
