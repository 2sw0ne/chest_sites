<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHEST 2.0 — Connexion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>

    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  

body{margin:0;background:#050506}
a{color:#f9a45e;text-decoration:none}a:hover{color:#ffffff}
.go{transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s cubic-bezier(.16,1,.3,1)}
.go:hover{transform:translateY(-1px);box-shadow:0 16px 44px rgba(252,18,131,.45)!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>

  <div data-dc-tpl="4" aria-hidden="true" style="position: absolute; left: 50%; top: -320px; width: 1400px; height: 820px; margin-left: -700px; pointer-events: none; filter: blur(110px); background: radial-gradient(34% 42% at 32% 52%, rgba(252, 18, 131, 0.34), transparent 72%), radial-gradient(32% 40% at 68% 46%, rgba(249, 164, 94, 0.26), transparent 74%);"></div>

    <div data-dc-tpl="8" aria-hidden="true" style="position: absolute; top: 0px; left: 10%; right: 10%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);"></div>
    <img data-dc-tpl="9" src="assets/logo-chest-new.webp" alt="CHEST" style="position: absolute; left: 50%; top: -38px; width: 76px; height: 76px; margin-left: -38px; object-fit: contain; filter: drop-shadow(rgba(252, 18, 131, 0.55) 0px 14px 30px);">
    <div data-dc-tpl="10" style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding-bottom: 8px;">

      <p data-dc-tpl="12" style="margin: 0px; font-size: 13.5px; color: rgb(155, 155, 161);">Ton poste de pilotage t'attend.</p>
    </div>

    <label data-dc-tpl="13" style="display: flex; flex-direction: column; gap: 7px;">
      <span data-dc-tpl="14" style="font-family: &quot;JetBrains Mono&quot;, ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgb(155, 155, 161);">E-mail</span>
      <span data-dc-tpl="15" style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0px 14px; border-radius: 12px; border: 1px solid rgba(252, 18, 131, 0.6); box-shadow: rgba(252, 18, 131, 0.16) 0px 0px 0px 3px; background: rgba(255, 255, 255, 0.035);">
        <svg data-dc-tpl="16" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f9a45e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect data-dc-tpl="17" x="3" y="5" width="18" height="14" rx="2.5"></rect><path data-dc-tpl="18" d="M3.5 6.5l8.5 6 8.5-6"></path></svg>
        <input data-dc-tpl="19" type="email" value="morgan@exemple.fr" style="flex: 1 1 0%; min-width: 0px; background: transparent; border: 0px; outline: 0px; color: rgb(246, 246, 247); font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 14px;">
      </span>
    </label>
    <label data-dc-tpl="20" style="display: flex; flex-direction: column; gap: 7px;">

      <span data-dc-tpl="22" style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0px 6px 0px 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.024);">
        <svg data-dc-tpl="23" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a7a82" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect data-dc-tpl="24" x="5" y="11" width="14" height="10" rx="2"></rect><path data-dc-tpl="25" d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <input data-dc-tpl="26" type="password" placeholder="••••••••" style="flex: 1 1 0%; min-width: 0px; background: transparent; border: 0px; outline: 0px; color: rgb(246, 246, 247); font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 14px;">

          <svg data-dc-tpl="28" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path data-dc-tpl="29" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle data-dc-tpl="30" cx="12" cy="12" r="3"></circle></svg>
        </button>

    </label>
    <div data-dc-tpl="31" style="display: flex; align-items: center; gap: 10px; font-size: 12.5px;">
      <label data-dc-tpl="32" style="display: flex; align-items: center; gap: 8px; color: rgb(155, 155, 161); cursor: pointer;">

      </label>
      <a data-dc-tpl="34" href="#" style="margin-left: auto;">Mot de passe oublié ?</a>
    </div>
    <button data-dc-tpl="35" type="submit" class="go" style="height: 50px; margin-top: 6px; border-radius: 999px; border: 0px; color: rgb(255, 255, 255); font-style: inherit; font-variant: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 15px; font-weight: 700; cursor: pointer; background: linear-gradient(135deg, rgb(252, 18, 131), rgb(249, 164, 94)); box-shadow: rgba(252, 18, 131, 0.32) 0px 10px 30px; display: flex; align-items: center; justify-content: center; gap: 8px;">
      Se connecter
      <svg data-dc-tpl="36" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path data-dc-tpl="37" d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </button>
    <div data-dc-tpl="38" style="display: flex; align-items: center; gap: 12px; padding: 4px 0px; font-family: &quot;JetBrains Mono&quot;, ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgb(92, 92, 99);">
      <span data-dc-tpl="39" style="flex: 1 1 0%; height: 1px; background: rgba(255, 255, 255, 0.08);"></span>bientôt<span data-dc-tpl="40" style="flex: 1 1 0%; height: 1px; background: rgba(255, 255, 255, 0.08);"></span>
    </div>
    <div data-dc-tpl="41" style="display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 8px;">
      <button data-dc-tpl="42" type="button" disabled="" style="height: 44px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.02); color: rgb(122, 122, 130); font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 12.5px; cursor: not-allowed;">Apple</button>
      <button data-dc-tpl="43" type="button" disabled="" style="height: 44px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.02); color: rgb(122, 122, 130); font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 12.5px; cursor: not-allowed;">Google</button>
      <button data-dc-tpl="44" type="button" disabled="" style="height: 44px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.02); color: rgb(122, 122, 130); font-style: inherit; font-variant: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; font-size: 12.5px; cursor: not-allowed;">Discord</button>
    </div>
    <p data-dc-tpl="45" style="margin: 6px 0px 0px; text-align: center; font-size: 13px; color: rgb(155, 155, 161);">Pas encore de compte ? <a data-dc-tpl="46" href="Offres.dc.html" style="font-weight: 600;">Créer un compte</a></p>
  </form>

  <nav data-dc-tpl="47" aria-label="Documents légaux" style="position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; font-size: 11.5px;">
    <a data-dc-tpl="48" href="#" style="color: rgb(122, 122, 130);">Mentions légales</a>
    <a data-dc-tpl="49" href="#" style="color: rgb(122, 122, 130);">CGU</a>
    <a data-dc-tpl="50" href="#" style="color: rgb(122, 122, 130);">Confidentialité</a>
    <a data-dc-tpl="51" href="#" style="color: rgb(122, 122, 130);">Risques</a>
